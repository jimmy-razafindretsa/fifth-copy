  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>

canvas{position:fixed;inset:0;display:block}

<body>
<div id="root" class="plate">
  <h1>THE RING ROOM</h1>
  <p>30 DESKS · THE MAJOR STANDS AT THE CENTRE · ONE DIRTY BULB</p>
  <div class="ctl">
    <div class="grp"><span>VIEW</span><div class="seg" data-k="view"><button data-v="over" class="on">OVERVIEW</button><button data-v="pov">SEAT POV</button><button data-v="free">FREE</button></div></div>
    <div class="grp"><span>PLATFORM</span><div class="seg" data-k="plat"><button data-v="on" class="on">TURNING</button><button data-v="off">STILL</button></div></div>
    <div class="grp"><span>BULB</span><div class="seg" data-k="bulb"><button data-v="on" class="on">STUTTERS</button><button data-v="off">STEADY</button></div></div>
    <div class="grp"><span>SHADOWS</span><div class="seg" data-k="shadow"><button data-v="off" class="on">OFF</button><button data-v="on">ON</button></div></div>
  </div>
</div>
<div class="stats" id="stats"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- palette (Art Direction: backroom grey, only red = flags) ----------
const COL = {
  floor: 0x77746C, floorIn: 0x837F76, seam: 0x67645D, wall: 0x949A8E, wains: 0x63655B, trim: 0x52534A, pillar: 0x80857A, ceil: 0x55574F,
  steel: 0x7D8A83, steelD: 0x5C6660, tw: 0x2F3A2E, key: 0xE8DCC0, chair: 0x4E3424, brass: 0xB8933F, red: 0xB81D24, banner: 0x7E1015,
  gold: 0xE2B23A, ink: 0x2A2420, paper: 0xE4D6B8, wood: 0x4E3424, leather: 0x2B1E16, glass: 0xCFE0DC, beige: 0xC9C2AE, cab: 0x60645D, enamel: 0x2F5A40,
};
const N = 30, R_CHAIR = 6.9, WALL_R = 10, H = 5.5, DESK_Y = 0.44;
const S = (r, w = 8, h = 6) => new THREE.SphereGeometry(r, w, h);
const C = (rt, rb, h, s = 8, open = false) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open);
const B = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const part = (g, geo, col, x, y, z) => { const m = new THREE.Mesh(geo); m.userData.col = col; m.position.set(x, y, z); g.add(m); return m; };

function flip(g) { const i = g.index.array; for (let k = 0; k < i.length; k += 3) { const t = i[k]; i[k] = i[k + 2]; i[k + 2] = t; } const n = g.attributes.normal.array; for (let k = 0; k < n.length; k++) n[k] *= -1; }
function merge(root) {
  root.updateMatrixWorld(true);
  const pos = [], nor = [], col = [], idx = [], c = new THREE.Color();
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.clone();
    if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
    if (g.type === 'LatheGeometry') { const p = g.attributes.position, n = g.attributes.normal, i = Math.floor(p.count / 2); if (p.getX(i) * n.getX(i) + p.getZ(i) * n.getZ(i) < 0) flip(g); }
    if (o.userData.flip) flip(g);
    g.applyMatrix4(o.matrixWorld);
    c.setHex(o.userData.col).convertSRGBToLinear();
    const base = pos.length / 3, p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
    for (const i of g.index.array) idx.push(base + i);
    g.dispose(); o.geometry.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  out.setIndex(idx); out.computeBoundingSphere();
  return out;
}

// ---------- one desk station (clerk seat at origin, facing +z) ----------
function desk(i) {
  const g = new THREE.Group(), P = (geo, c, x, y, z) => part(g, geo, c, x, y, z);
  P(B(1.2, 0.04, 0.6), COL.steel, 0, DESK_Y - 0.02, 0.6);
  P(B(0.34, DESK_Y - 0.04, 0.54), COL.steelD, 0.4, (DESK_Y - 0.04) / 2, 0.6);
  [0.3, 0.17].forEach(y => P(B(0.28, 0.006, 0.01), COL.ink, 0.4, y, 0.33));
  [0.34, 0.86].forEach(z => P(B(0.04, DESK_Y - 0.04, 0.04), COL.steelD, -0.56, (DESK_Y - 0.04) / 2, z));
  P(B(1.1, 0.24, 0.02), COL.steelD, 0, DESK_Y - 0.16, 0.88);
  // chair
  P(B(0.42, 0.04, 0.4), COL.chair, 0, 0.26, -0.06);
  [[-0.18, 0.1], [0.18, 0.1], [-0.18, -0.22], [0.18, -0.22]].forEach(([x, z]) => P(C(0.018, 0.018, 0.24, 5), COL.wood, x, 0.12, z));
  [-0.18, 0.18].forEach(x => P(C(0.018, 0.018, 0.44, 5), COL.wood, x, 0.48, -0.27));
  P(B(0.42, 0.12, 0.025), COL.chair, 0, 0.62, -0.27);
  // typewriter
  P(B(0.46, 0.035, 0.3), COL.tw, 0, DESK_Y + 0.0175, 0.47);
  P(B(0.4, 0.03, 0.15), COL.tw, 0, DESK_Y + 0.05, 0.38).rotation.x = 0.25;
  P(B(0.44, 0.11, 0.16), COL.tw, 0, DESK_Y + 0.09, 0.55);
  [-1, 1].forEach(s => P(B(0.03, 0.06, 0.1), COL.tw, s * 0.23, DESK_Y + 0.16, 0.56));
  P(C(0.035, 0.035, 0.5, 8), COL.ink, 0, DESK_Y + 0.19, 0.56).rotation.z = Math.PI / 2;
  [-1, 1].forEach(s => P(C(0.045, 0.045, 0.03, 8), 0x9A9D95, s * 0.265, DESK_Y + 0.19, 0.56).rotation.z = Math.PI / 2);
  P(B(0.012, 0.012, 0.15), COL.brass, -0.29, DESK_Y + 0.22, 0.48);
  if (i !== 0) P(B(0.26, 0.22, 0.004), COL.paper, 0, DESK_Y + 0.3, 0.54).rotation.x = -0.15; // seat 0 = POV: player's sheet is the HTML layer
  for (let r = 0; r < 4; r++) for (let c = 0; c < 10; c++) P(C(0.012, 0.012, 0.014, 6), COL.key, -0.15 + c * 0.033 + r * 0.008, DESK_Y + 0.062 + r * 0.014, 0.34 + r * 0.03);
  // a little clutter per desk
  const h = hash(i);
  if (h < 0.45) { P(C(0.06, 0.05, 0.02, 10), 0x3A3C38, -0.45, DESK_Y + 0.01, 0.42); P(C(0.006, 0.006, 0.06, 4), 0xF1E8D6, -0.43, DESK_Y + 0.025, 0.42).rotation.z = Math.PI / 2; }
  if (h > 0.3) P(B(0.2, 0.03 + hash(i + 1) * 0.05, 0.27), COL.paper, 0.42, DESK_Y + 0.03, 0.66);
  if (h > 0.7) { P(C(0.03, 0.026, 0.08, 8), COL.glass, -0.42, DESK_Y + 0.04, 0.7); P(C(0.034, 0.03, 0.05, 8), COL.brass, -0.42, DESK_Y + 0.025, 0.7); }
  if (hash(i + 3) > 0.6) { P(C(0.03, 0.03, 0.015, 8), COL.ink, -0.3, DESK_Y + 0.008, 0.75); P(C(0.012, 0.012, 0.05, 6), COL.wood, -0.3, DESK_Y + 0.04, 0.75); P(S(0.018, 6, 4), COL.wood, -0.3, DESK_Y + 0.07, 0.75); }
  return g;
}

// ---------- wall pieces (local: on the wall, facing +z toward centre) ----------
function flag(g) {
  part(g, B(1.1, 2.2, 0.03), COL.red, 0, 3.2, 0);
  part(g, B(1.1, 0.06, 0.035), COL.banner, 0, 2.1, 0);
  part(g, C(0.22, 0.22, 0.035, 16), COL.gold, 0, 3.65, 0.02).rotation.x = Math.PI / 2;
  part(g, C(0.025, 0.025, 1.4, 6), COL.brass, 0, 4.33, 0.05).rotation.z = Math.PI / 2;
  [-1, 1].forEach(s => part(g, S(0.05, 6, 4), COL.brass, s * 0.72, 4.33, 0.05));
}
function portrait(g) {
  part(g, B(1.4, 1.8, 0.08), 0x8A6A2A, 0, 3.3, 0);
  part(g, B(1.18, 1.58, 0.09), COL.ink, 0, 3.3, 0.005);
  part(g, B(0.5, 0.04, 0.1), COL.brass, 0, 4.3, 0.1);
}
function cabinets(g) {
  [-0.32, 0.32].forEach(x => {
    part(g, B(0.58, 1.35, 0.6), COL.cab, x, 0.675, 0.32);
    for (let k = 0; k < 4; k++) { part(g, B(0.14, 0.02, 0.03), COL.brass, x, 0.22 + k * 0.32, 0.63); part(g, B(0.09, 0.04, 0.008), COL.paper, x, 0.28 + k * 0.32, 0.625); }
  });
  part(g, B(0.3, 0.12, 0.22), COL.paper, -0.3, 1.41, 0.3);
}
function samovarTable(g) {
  part(g, C(0.42, 0.42, 0.04, 14), COL.wood, 0, 0.75, 0.55);
  part(g, C(0.04, 0.06, 0.73, 8), COL.wood, 0, 0.37, 0.55);
  part(g, C(0.22, 0.26, 0.03, 14), COL.brass, 0, 0.78, 0.55);
  const prof = [[0, 0], [0.06, 0], [0.08, 0.04], [0.06, 0.08], [0.14, 0.12], [0.16, 0.26], [0.12, 0.36], [0.07, 0.38], [0.05, 0.44], [0, 0.44]];
  part(g, new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 12), COL.brass, 0, 0.795, 0.55);
  part(g, C(0.02, 0.02, 0.1, 6), COL.brass, 0, 1.28, 0.55);
  part(g, B(0.08, 0.015, 0.015), COL.brass, 0, 0.95, 0.72);
  [-1, 1].forEach(s => part(g, new THREE.TorusGeometry(0.05, 0.01, 4, 10, Math.PI), COL.ink, s * 0.17, 1.05, 0.55).rotation.z = s * -Math.PI / 2);
  [0.25, -0.25].forEach(x => { part(g, C(0.03, 0.026, 0.08, 8), COL.glass, x, 0.81, 0.4); part(g, C(0.034, 0.03, 0.05, 8), COL.brass, x, 0.795, 0.4); });
}

// ---------- build the static room ----------
const room = new THREE.Group();
part(room, C(WALL_R, WALL_R, 0.1, 64), COL.floor, 0, -0.05, 0);
part(room, C(5.4, 5.4, 0.012, 64), COL.floorIn, 0, 0.006, 0);
for (let k = 0; k < 16; k++) { const s = part(room, B(0.02, 0.004, WALL_R * 2), COL.seam, 0, 0.003, 0); s.rotation.y = k / 16 * Math.PI; }
part(room, C(WALL_R, WALL_R, H, 64, true), COL.wall, 0, H / 2, 0).userData.flip = true;
part(room, C(WALL_R - 0.04, WALL_R - 0.04, 1.1, 64, true), COL.wains, 0, 0.55, 0).userData.flip = true;
part(room, C(WALL_R - 0.06, WALL_R - 0.06, 0.08, 64, true), COL.trim, 0, 1.12, 0).userData.flip = true;
part(room, C(WALL_R, WALL_R, 0.1, 64), COL.ceil, 0, H + 0.05, 0);
for (let k = 0; k < 10; k++) {
  const a = (k + 0.5) / 10 * Math.PI * 2, p = part(room, B(0.6, H, 0.5), COL.pillar, Math.sin(a) * (WALL_R - 0.22), H / 2, Math.cos(a) * (WALL_R - 0.22)); p.rotation.y = a;
}
const WALL_SLOTS = { 0: portrait, 2: flag, 3: flag, 7: flag, 8: flag, 1: cabinets, 4: cabinets, 6: cabinets, 9: cabinets, 5: samovarTable };
Object.entries(WALL_SLOTS).forEach(([k, fn]) => {
  const a = k / 10 * Math.PI * 2, g = new THREE.Group(); g.position.set(Math.sin(a) * (WALL_R - 0.08), 0, Math.cos(a) * (WALL_R - 0.08)); g.rotation.y = a + Math.PI; fn(g); room.add(g);
});
for (let i = 0; i < N; i++) {
  const a = i / N * Math.PI * 2, g = desk(i); g.position.set(Math.sin(a) * R_CHAIR, 0, Math.cos(a) * R_CHAIR); g.rotation.y = a + Math.PI; room.add(g);
}
// bulb cord + enamel shade (outer + inner face)
part(room, C(0.01, 0.01, H - 3.45, 4), COL.ink, 0, (H + 3.45) / 2, 0);
part(room, C(0.12, 0.55, 0.32, 16, true), COL.enamel, 0, 3.4, 0);
part(room, C(0.115, 0.545, 0.31, 16, true), 0xD8D2C0, 0, 3.4, 0).userData.flip = true;
part(room, C(0.13, 0.13, 0.04, 10), COL.enamel, 0, 3.57, 0);

// ---------- the Major's turning platform ----------
const plat = new THREE.Group();
part(plat, C(1.5, 1.6, 0.3, 32), COL.steelD, 0, 0.15, 0);
part(plat, C(1.53, 1.53, 0.04, 32), COL.brass, 0, 0.29, 0);
part(plat, C(1.45, 1.45, 0.02, 32), 0x4A4E48, 0, 0.31, 0);
const TOP = 0.31;
// The Major stands here, watching. Brass footplate marks his spot; period props around him.
part(plat, C(0.42, 0.42, 0.012, 20), COL.brass, 0, TOP + 0.006, 0);
part(plat, C(0.36, 0.36, 0.014, 20), 0x3A3C38, 0, TOP + 0.008, 0);
const tx = 0.62, tz = 0.12;
part(plat, C(0.2, 0.2, 0.03, 14), COL.wood, tx, TOP + 0.72, tz);
part(plat, C(0.025, 0.035, 0.7, 6), COL.wood, tx, TOP + 0.36, tz);
part(plat, C(0.14, 0.14, 0.02, 10), COL.wood, tx, TOP + 0.01, tz);
const D = TOP + 0.735;
part(plat, C(0.022, 0.018, 0.05, 8), COL.glass, tx + 0.1, D + 0.025, tz - 0.08);
part(plat, C(0.06, 0.05, 0.02, 10), 0x3A3C38, tx - 0.02, D + 0.01, tz + 0.12);
part(plat, B(0.5, 0.45, 0.4), 0x5A4A36, -0.75, TOP + 0.225, -0.45);
part(plat, B(0.38, 0.32, 0.34), COL.beige, -0.75, TOP + 0.61, -0.45);
part(plat, B(0.42, 0.3, 0.32), 0x8A7B5C, 0.7, TOP + 0.15, -0.6);
part(plat, B(0.36, 0.06, 0.26), COL.paper, 0.7, TOP + 0.33, -0.6);

// ---------- renderer, lights, materials ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x4A4C47); scene.fog = new THREE.Fog(0x4A4C47, 20, 42);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxDistance = 9.2; controls.maxPolarAngle = Math.PI * 0.48; controls.target.set(0, 0.8, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const mat = new THREE.MeshLambertMaterial({ vertexColors: true }); mat.name = 'room_vertex_colour';
const roomMesh = new THREE.Mesh(merge(room), mat); roomMesh.receiveShadow = true; roomMesh.castShadow = true; scene.add(roomMesh);
const platMesh = new THREE.Mesh(merge(plat), mat); platMesh.castShadow = platMesh.receiveShadow = true;
const platG = new THREE.Group(); platG.add(platMesh); scene.add(platG);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.22), new THREE.MeshBasicMaterial({ color: 0x3FA66B }));
screen.position.set(-0.75, TOP + 0.62, -0.279); platG.add(screen);

// ---------- the Major (stands on the footplate, hands behind back, watching) ----------
const MAJ = { olive: 0x5B5E3C, oliveD: 0x3F4229, gold: COL.gold, boot: 0x161514, skin: 0xEBC09C, grey: 0x9A978E, belt: 0x3A2A1C };
const LATHE = (pts, s = 14) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), s);
const majBody = new THREE.Group(), majHead = new THREE.Group(), majArmG = {};
{
  const P = (geo, c, x, y, z) => part(majBody, geo, c, x, y, z);
  [-1, 1].forEach(s => {
    P(C(0.08, 0.075, 0.26, 10), MAJ.boot, s * 0.11, 0.13, 0);
    P(C(0.086, 0.086, 0.03, 10), 0x2A2826, s * 0.11, 0.255, 0);
    P(S(0.08, 10, 6), MAJ.boot, s * 0.11, 0.04, 0.05).scale.set(1, 0.55, 1.5);
    P(S(0.12, 10, 8), MAJ.olive, s * 0.115, 0.33, 0).scale.set(0.95, 1.2, 1);
  });
  const pear = [[0, 0], [0.19, 0.01], [0.28, 0.08], [0.31, 0.2], [0.3, 0.32], [0.26, 0.42], [0.18, 0.5], [0.08, 0.54], [0, 0.55]];
  P(LATHE(pear), MAJ.olive, 0, 0.36, 0).scale.set(1, 1, 0.88);
  P(LATHE(pear.slice(1, 5).map(([x, y]) => [x * 1.05, y])), MAJ.olive, 0, 0.33, 0).scale.set(1, 1, 0.88);
  P(C(0.316, 0.316, 0.05, 16), MAJ.belt, 0, 0.56, 0).scale.set(1, 1, 0.88);
  P(B(0.08, 0.05, 0.02), COL.brass, 0, 0.56, 0.28);
  [0.5, 0.64, 0.74, 0.83].forEach(y => P(S(0.013, 6, 4), COL.brass, 0, y, y < 0.6 ? 0.27 : 0.25 - (y - 0.64) * 0.5));
  P(C(0.11, 0.13, 0.06, 12), MAJ.olive, 0, 0.92, 0);
  [-1, 1].forEach(s => {
    P(B(0.04, 0.03, 0.01), MAJ.gold, s * 0.05, 0.92, 0.12);
    const ep = P(B(0.15, 0.03, 0.11), MAJ.gold, s * 0.22, 0.85, 0); ep.rotation.z = s * -0.35;
    P(B(0.012, 0.6, 0.012), MAJ.oliveD, s * 0.115, 0.35, 0.115);
  });
  // ribbon bars + medals on the chest (left side)
  const RIB = [MAJ.gold, 0x3E3A78, 0x2F7A52, 0xE8DCC0, 0x3E3A78, MAJ.gold];
  RIB.forEach((c, k) => { const m = P(B(0.05, 0.022, 0.012), c, -0.2 + (k % 3) * 0.055, 0.78 - Math.floor(k / 3) * 0.028, 0.215); m.rotation.y = -0.45; });
  [-0.19, -0.13].forEach((x, k) => { const m = P(C(0.028, 0.028, 0.01, 5), MAJ.gold, x, 0.69, 0.235 - k * 0.012); m.rotation.x = Math.PI / 2; m.rotation.y = -0.4; });
  const hero = P(C(0.035, 0.035, 0.012, 5), MAJ.gold, 0.13, 0.75, 0.235); hero.rotation.x = Math.PI / 2; hero.rotation.y = 0.4;
  // arms at the sides, resting over the belly
  [-1, 1].forEach(s => {
    const a = new THREE.Group(); majArmG[s] = a;
