<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const ARM_L = 0.33, SEAT = 0.26, ROOT_Y = 0.10, DESK_Y = 0.44;
const CATS = {
  hair:    { label: 'HAIR', opts: [['side', 'Side part', 'CLERK STANDARD'], ['buzz', 'Buzz cut', 'BARRACKS'], ['quiff', 'Quiff', 'DANCE HALL'], ['bowl', 'Bowl cut', 'HOME-MADE'], ['bald', 'Bald', 'POLISHED']] },
  glasses: { label: 'GLASSES', opts: [['round', 'Round wire', 'BRASS FRAME'], ['dark', 'Dark lenses', 'SECRET POLICE'], ['square', 'Square frames', 'ACCOUNTANT'], ['monocle', 'Monocle', 'OLD MONEY'], ['none', 'None', '20/20 VISION']] },
  hat:     { label: 'HAT', opts: [['none', 'None', 'INDOORS'], ['ushanka', 'Ushanka', 'WINTER ISSUE'], ['kepka', 'Flat cap', 'FACTORY FLOOR'], ['eyeshade', 'Eyeshade', 'NIGHT SHIFT'], ['beret', 'Beret', 'ARTIST UNION']] },
  clothes: { label: 'CLOTHES', opts: [['vest', 'Knit vest', 'OLIVE WOOL'], ['cardigan', 'Cardigan', 'GRANDMA KNIT'], ['jacket', 'Work jacket', 'NAVY CANVAS'], ['sweater', 'Sweater', 'GREY RIB'], ['braces', 'Shirt & braces', 'SUMMER']] },
  face:    { label: 'FACE', opts: [['stache', 'Moustache', 'REGULATION'], ['clean', 'Clean shave', 'FRESH RAZOR'], ['beard', 'Full beard', 'PHILOSOPHER']] },
};
const HAIRCOL = ['#4A3526', '#1E1A17', '#A4552A', '#C9A465', '#8C8A84'];
const cfg = { hair: 'side', glasses: 'round', hat: 'none', clothes: 'vest', face: 'stache', hairCol: HAIRCOL[0] };
let tab = 'hair';

const COL = { skin: 0xF0C6A2, white: 0xF6F1E6, black: 0x161616, shirt: 0xE6DCC6, trousers: 0x55544E, shoe: 0x241914, brass: 0xB8933F, scarf: 0x2E8C8A };
const CLOTH = {
  vest: { body: 0x5E6140, sleeve: COL.shirt, gap: 1.0 }, cardigan: { body: 0x7A5638, sleeve: 0x7A5638, gap: 0.55 },
  jacket: { body: 0x34405A, sleeve: 0x34405A, gap: 0 }, sweater: { body: 0x8A8C85, sleeve: 0x8A8C85, gap: 0 }, braces: { body: null, sleeve: COL.shirt },
};
const S = (r, w = 8, h = 6) => new THREE.SphereGeometry(r, w, h);
const HS = (r, w, h, p0, pl, t0, tl) => new THREE.SphereGeometry(r, w, h, p0, pl, t0, tl);
const C = (rt, rb, h, s = 8, open = false, a0 = 0, a = Math.PI * 2) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open, a0, a);
const B = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const CAP = (r, l) => new THREE.CapsuleGeometry(r, l, 2, 8);
const TOR = (r, t, rs, ts, arc) => new THREE.TorusGeometry(r, t, rs, ts, arc);
const V2 = pts => pts.map(p => new THREE.Vector2(p[0], p[1]));
const PEAR = [[0,0],[0.17,0.01],[0.25,0.07],[0.285,0.17],[0.275,0.27],[0.24,0.36],[0.17,0.43],[0.08,0.47],[0,0.48]];

function build(c) {
  const root = new THREE.Group();
  const part = (geo, col, x, y, z, parent = root) => { const m = new THREE.Mesh(geo); m.userData.col = col; m.position.set(x, y, z); parent.add(m); return m; };
  const hair = new THREE.Color(c.hairCol).getHex();
  const cl = CLOTH[c.clothes];
  // legs + feet
  [-1, 1].forEach(s => { const th = part(CAP(0.08, 0.12), COL.trousers, s * 0.1, 0.2, 0.1); th.rotation.x = Math.PI / 2; part(CAP(0.075, 0.1), COL.trousers, s * 0.1, 0.07, 0.24); part(S(0.075, 8, 6), COL.shoe, s * 0.11, -0.055, 0.29).scale.set(1, 0.6, 1.35); });
  // body
  part(new THREE.LatheGeometry(V2(PEAR), 12), COL.shirt, 0, 0.16, 0).scale.set(1, 1, 0.88);
  if (cl.body) {
    const sc = c.clothes === 'jacket' ? 1.08 : 1.06, top = c.clothes === 'vest' ? 8 : 9;
    const prof = PEAR.slice(1, top).map(([x, y]) => [x * sc + 0.004, y - (c.clothes === 'jacket' ? 0.02 : 0)]);
    const g = cl.gap ? new THREE.LatheGeometry(V2(prof), 12, cl.gap / 2, Math.PI * 2 - cl.gap) : new THREE.LatheGeometry(V2(prof), 12);
    part(g, cl.body, 0, 0.16, 0).scale.set(1, 1, 0.88);
    if (c.clothes === 'cardigan') [0.42, 0.34, 0.26].forEach(y => part(S(0.014, 4, 3), COL.brass, 0.07, y, 0.235));
    if (c.clothes === 'vest') [0.4, 0.32].forEach(y => part(S(0.012, 4, 3), COL.brass, 0, y, 0.25));
    if (c.clothes === 'jacket') {
      [-1, 1].forEach(s => { const k = part(B(0.09, 0.05, 0.02), cl.body, s * 0.07, 0.6, 0.15); k.rotation.z = s * -0.5; k.rotation.x = -0.5; part(B(0.07, 0.06, 0.012), 0x2A3348, s * 0.11, 0.3, 0.23).rotation.y = s * 0.4; });
      part(B(0.012, 0.32, 0.012), 0x2A3348, 0, 0.36, 0.25);
    }
    if (c.clothes === 'sweater') part(C(0.2, 0.18, 0.04, 12), 0x75776F, 0, 0.17, 0).scale.set(1, 1, 0.88);
  } else {
    [-1, 1].forEach(s => { part(B(0.025, 0.36, 0.012), COL.black, s * 0.1, 0.42, 0.225).rotation.x = -0.12; part(B(0.025, 0.36, 0.012), COL.black, s * 0.1, 0.42, -0.215).rotation.x = 0.12; });
  }
  part(TOR(0.12, 0.045, 5, 12), COL.scarf, 0, 0.62, 0.01).rotation.x = Math.PI / 2 - 0.15;
  // arms
  [-1, 1].forEach(s => {
    const arm = new THREE.Group(); arm.name = s < 0 ? 'armL' : 'armR'; arm.position.set(s * 0.26, 0.5, 0.05); root.add(arm);
    part(CAP(0.062, ARM_L - 0.17), cl.sleeve, 0, -(ARM_L - 0.06) / 2, 0, arm);
    if (c.clothes === 'vest' || c.clothes === 'braces') part(C(0.066, 0.066, 0.03, 8), COL.black, 0, -0.05, 0, arm);
    part(S(0.058, 8, 6), COL.skin, 0, -ARM_L, 0, arm);
  });
  // head
  const R = 0.22, h = new THREE.Group(); h.name = 'head'; h.position.set(0, 0.8, 0.02); root.add(h);
  part(S(R, 14, 10), COL.skin, 0, 0, 0, h).scale.set(1.06, 0.96, 1);
  part(S(R * 0.19, 8, 6), COL.skin, 0, -R * 0.1, R * 0.98, h);
  if (c.hat !== 'ushanka') [-1, 1].forEach(s => part(S(R * 0.16, 6, 4), COL.skin, s * R * 1.02, -R * 0.02, 0, h).scale.set(0.5, 1, 0.8));
  const ey = R * 0.14, ez = R * 0.86;
  const eyes = new THREE.Group(); eyes.name = 'eyes'; h.add(eyes); const lids = new THREE.Group(); lids.name = 'lids'; h.add(lids);
  [-1, 1].forEach(s => {
    const ex = s * R * 0.35;
    part(S(R * 0.15, 8, 6), COL.white, ex, ey, ez, h).scale.set(1, 1.15, 0.55);
    part(S(R * 0.075, 6, 4), COL.black, ex - s * R * 0.02, ey - R * 0.01, ez + R * 0.07, eyes).scale.set(1, 1.15, 0.5);
    part(S(R * 0.022, 4, 3), COL.white, ex - s * R * 0.02 + R * 0.03, ey + R * 0.04, ez + R * 0.1, eyes);
    part(S(R * 0.17, 8, 6), COL.skin, ex, ey, ez + R * 0.01, lids).scale.set(1, 1.2, 0.72);
    if (c.hair !== 'bowl') part(CAP(R * 0.04, R * 0.18), hair, ex, ey + R * 0.3, ez + R * 0.02, h).rotation.z = Math.PI / 2 + s * 0.15;
  });
  // glasses
  const gz = ez + R * 0.1;
  if (c.glasses === 'round') {
    [-1, 1].forEach(s => part(TOR(R * 0.2, R * 0.022, 4, 12), COL.brass, s * R * 0.35, ey, gz, h));
    part(C(R * 0.015, R * 0.015, R * 0.25, 4), COL.brass, 0, ey + R * 0.02, gz, h).rotation.z = Math.PI / 2;
  } else if (c.glasses === 'dark') {
    [-1, 1].forEach(s => part(C(R * 0.21, R * 0.21, R * 0.04, 12), COL.black, s * R * 0.35, ey, gz, h).rotation.x = Math.PI / 2);
    part(B(R * 0.25, R * 0.04, R * 0.04), COL.black, 0, ey + R * 0.04, gz, h);
  } else if (c.glasses === 'square') {
    [-1, 1].forEach(s => {
      const x = s * R * 0.36, w = R * 0.44, t = R * 0.06;
      part(B(w, t, t), COL.black, x, ey + R * 0.17, gz, h); part(B(w, t, t), COL.black, x, ey - R * 0.17, gz, h);
      part(B(t, R * 0.4, t), COL.black, x - w / 2, ey, gz, h); part(B(t, R * 0.4, t), COL.black, x + w / 2, ey, gz, h);
    });
    part(B(R * 0.2, t0(), R * 0.04), COL.black, 0, ey + R * 0.1, gz, h);
  } else if (c.glasses === 'monocle') {
    part(TOR(R * 0.21, R * 0.03, 4, 12), COL.brass, R * 0.35, ey, gz, h);
    part(B(R * 0.02, R * 0.7, R * 0.02), COL.brass, R * 0.55, ey - R * 0.45, gz - R * 0.05, h);
  }
  function t0() { return R * 0.04; }
  // face
  if (c.face === 'beard') part(S(R * 0.78, 10, 6), hair, 0, -R * 0.42, R * 0.28, h).scale.set(1.2, 0.85, 0.95);
  if (c.face !== 'clean') [-1, 1].forEach(s => { const m = part(CAP(R * 0.07, R * 0.16), hair, s * R * 0.13, -R * 0.3, R * 0.95, h); m.rotation.z = Math.PI / 2 + s * 0.25; });
  if (c.face !== 'beard') part(TOR(R * 0.12, R * 0.025, 4, 8, Math.PI), COL.black, 0, -R * 0.4, R * 0.9, h).rotation.z = Math.PI;
  // hair
  if (c.hair === 'side') {
    part(HS(R * 1.04, 14, 4, 0, Math.PI * 2, 0, Math.PI * 0.34), hair, 0, R * 0.06, -R * 0.02, h).scale.set(1.06, 1, 1);
    const f = part(HS(R * 1.09, 10, 2, Math.PI / 2 - 1.0, 2.0, Math.PI * 0.16, Math.PI * 0.2), hair, 0, R * 0.04, 0, h); f.scale.set(1.06, 1, 1); f.rotation.z = -0.22; f.rotation.y = 0.12;
    part(HS(R * 1.05, 10, 3, Math.PI * 1.5 - 1.5, 3.0, Math.PI * 0.28, Math.PI * 0.32), hair, 0, R * 0.02, -R * 0.02, h).scale.set(1.06, 1, 1);
  } else if (c.hair === 'buzz') {
    part(HS(R * 1.015, 14, 5, 0, Math.PI * 2, 0, Math.PI * 0.4), hair, 0, R * 0.03, -R * 0.03, h).scale.set(1.06, 0.97, 1);
  } else if (c.hair === 'quiff') {
    part(HS(R * 1.03, 14, 4, 0, Math.PI * 2, 0, Math.PI * 0.36), hair, 0, R * 0.05, -R * 0.04, h).scale.set(1.06, 1, 1);
    const q = part(S(R * 0.45, 10, 6), hair, 0, R * 1.0, R * 0.42, h); q.scale.set(1.35, 0.75, 1.1); q.rotation.x = -0.35;
    part(HS(R * 1.05, 10, 3, Math.PI * 1.5 - 1.5, 3.0, Math.PI * 0.28, Math.PI * 0.32), hair, 0, R * 0.02, -R * 0.02, h).scale.set(1.06, 1, 1);
  } else if (c.hair === 'bowl') {
    part(HS(R * 1.07, 14, 5, 0, Math.PI * 2, 0, Math.PI * 0.42), hair, 0, R * 0.07, 0, h).scale.set(1.07, 1, 1.03);
  }
  // hats
  if (c.hat === 'ushanka') {
    const fur = 0x6B4E36, top = 0x4E3A2A;
    part(C(R * 1.12, R * 1.14, R * 0.55, 14), top, 0, R * 0.78, -R * 0.02, h);
    part(C(R * 1.16, R * 1.16, R * 0.22, 14), fur, 0, R * 0.55, -R * 0.02, h);
    part(B(R * 0.9, R * 0.3, R * 0.22), fur, 0, R * 0.78, R * 1.0, h).rotation.x = -0.25;
    [-1, 1].forEach(s => part(S(R * 0.4, 8, 6), fur, s * R * 1.0, R * 0.05, -R * 0.05, h).scale.set(0.4, 1.1, 0.9));
  } else if (c.hat === 'kepka') {
    const tw = 0x6E6A5E;
    part(S(R * 1.1, 14, 6), tw, 0, R * 0.66, -R * 0.05, h).scale.set(1.06, 0.42, 1.12);
    part(C(R * 0.7, R * 0.7, R * 0.04, 10, false, -Math.PI / 2, Math.PI), 0x5A574D, 0, R * 0.56, R * 0.78, h).scale.set(1, 1, 0.65);
    part(S(R * 0.06, 4, 3), tw, 0, R * 1.08, R * 0.1, h);
  } else if (c.hat === 'eyeshade') {
    part(C(R * 1.09, R * 1.11, R * 0.16, 14), 0x1C3D2B, 0, R * 0.6, 0, h).scale.set(1.06, 1, 1);
    const sh = new THREE.Shape(); sh.absarc(0, 0, R * 1.6, Math.PI * 0.12, Math.PI * 0.88, false); sh.absarc(0, 0, R * 1.05, Math.PI * 0.88, Math.PI * 0.12, true);
    const br = part(new THREE.ExtrudeGeometry(sh, { depth: R * 0.03, bevelEnabled: false, curveSegments: 6 }), 0x2F7A52, 0, R * 0.58, 0, h);
    br.rotation.x = Math.PI / 2 + 0.08;
  } else if (c.hat === 'beret') {
    const b = part(S(R * 1.02, 14, 6), 0x2A3140, R * 0.1, R * 0.82, -R * 0.02, h); b.scale.set(1.18, 0.34, 1.12); b.rotation.z = -0.22;
    part(C(R * 0.03, R * 0.03, R * 0.1, 4), 0x2A3140, R * 0.06, R * 1.18, 0, h);
  }
  
  return root;
}

// Merge into one indexed vertex-coloured geometry (same pipeline as the in-game clerk)
function faceOut(g) {
  const p = g.attributes.position, n = g.attributes.normal, i = Math.floor(p.count / 2);
  if (p.getX(i) * n.getX(i) + p.getZ(i) * n.getZ(i) >= 0) return;
  const idx = g.index.array; for (let k = 0; k < idx.length; k += 3) { const t = idx[k]; idx[k] = idx[k + 2]; idx[k + 2] = t; }
  for (let k = 0; k < n.array.length; k++) n.array[k] *= -1;
}
function merge(root, low) {
  root.updateMatrixWorld(true);
  const pos = [], nor = [], col = [], idx = [], c = new THREE.Color();
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = low ? lowGeo(o.geometry) : o.geometry.clone();
    if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
    if (g.type === 'LatheGeometry') faceOut(g);
    g.applyMatrix4(o.matrixWorld);
    c.setHex(o.userData.col).convertSRGBToLinear();
    const base = pos.length / 3, p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
    for (const i of g.index.array) idx.push(base + i);
    g.dispose(); o.geometry.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  out.setIndex(idx); out.computeBoundingSphere();
  return out;
}



function lowGeo(g) {
  const p = g.parameters, half = (n, m) => Math.max(m, Math.ceil(n / 2));
  switch (g.type) {
    case 'SphereGeometry': return new THREE.SphereGeometry(p.radius, half(p.widthSegments, 5), half(p.heightSegments, 3), p.phiStart, p.phiLength, p.thetaStart, p.thetaLength);
    case 'LatheGeometry': return new THREE.LatheGeometry(p.points, half(p.segments, 7), p.phiStart, p.phiLength);

  const ee = 1 - Math.exp(-dt * 18); E.x += ((H.ty - H.y) * 0.05 + E.jx - E.x) * ee; E.y += (-(H.tx - H.x) * 0.05 + E.jy - E.y) * ee;

  const ph = c.piv.head; _p.set(d.x + ph.x, ROOT_Y + ph.y + bob, d.z + ph.z); _e.set(H.x, H.y, 0); _q.setFromEuler(_e); _s.set(1, 1, 1); _h.compose(_p, _q, _s); put(c, 'head', _h);
  if (c.curLod === 0) {
    _p.set(clamp(E.x, -0.012, 0.012), clamp(E.y, -0.008, 0.008), 0); _s.set(1, 1 - lid * 0.9, 1); _l.compose(_p, _I, _s); _m.multiplyMatrices(_h, _l); put(c, 'eyes', _m);
    _p.set(0, 0, 0); _s.set(1, Math.max(0.001, lid), 1); _l.compose(_p, _I, _s); _m.multiplyMatrices(_h, _l); put(c, 'lids', _m); setVis(c, 'lids', lid > 0.01);
  }
  aimArm(c, 'armL', tL, d); aimArm(c, 'armR', tR, d);
  _s.set(1, 1, 1); _p.set(d.x + cx, DESK_Y + 0.19, d.z + 0.56); _m.compose(_p, _I, _s);
  if (BATCHED) carrIM.setMatrixAt(i, _m); else carrMeshes[i].matrix.copy(_m);
  _p.set(d.x + cx, DESK_Y + 0.14 + cur * 0.022, d.z + 0.54); _e.set(-0.15, 0, 0); _q.setFromEuler(_e); _m.compose(_p, _q, _s);

}
let lodT = 0;
function updateLod() {
  const order = active.map((c, i) => [camera.position.distanceToSquared(L.desks[i]), i]).sort((a, b) => a[0] - b[0]);
  order.forEach(([, i], rank) => {
    const c = active[i], lod = rank < P.near ? 0 : 1; if (lod === c.curLod) return; c.curLod = lod;
    ['body', 'head', 'armL', 'armR'].forEach(p => { if (BATCHED) bm.setGeometryIdAt(c.inst[p], c.ids[p][lod]); else c.mesh[p].geometry = lod ? c.geos[p].g1 : c.geos[p].g0; });
    setVis(c, 'eyes', lod === 0); setVis(c, 'lids', false);
  });
}

// ---- Views, stats, benchmark ----
function setView(vw) {
  VIEW = vw;
  if (vw === 'over') { camera.position.set(L.W * 0.42, 3.0, L.D * 0.44); controls.target.set(0, 0.6, -0.6); }
  else { const d = L.desks[Math.floor(L.cols / 2)]; camera.position.set(d.x, 1.3, d.z - 0.35); controls.target.set(d.x, 0.7, d.z + 2.5); }
  controls.update();
}
const statsEl = document.getElementById('stats'), resEl = document.getElementById('result');
let acc = { f: 0, t: 0, js: 0 }, bench = null, frameNo = 0, last = performance.now();
function fpsCol(f) { return f >= 55 ? '#5CFF8A' : f >= 30 ? '#FFB347' : '#FF6A5C'; }
function updateStats() {
  const fps = acc.f / acc.t, inf = renderer.info, cv = renderer.domElement;
  const tris = Math.round(inf.render.triangles);
  statsEl.innerHTML =
    '<b style="color:' + fpsCol(fps) + '">' + fps.toFixed(0) + ' FPS</b><i>' + (1000 * acc.t / acc.f).toFixed(1) + ' ms/frame</i>' +
    '<span>DRAW CALLS</span><em>' + inf.render.calls + '</em>' +
    '<span>TRIANGLES</span><em>' + tris.toLocaleString('en') + '</em>' +
    '<span>GEOMETRIES</span><em>' + inf.memory.geometries + '</em>' +
    '<span>ANIM (JS)</span><em>' + (acc.js / acc.f).toFixed(2) + ' ms</em>' +
    '<span>CPU / FRAME</span><em>' + (acc.cpu / acc.f).toFixed(1) + ' ms</em>' +
    '<span>RESOLUTION</span><em>' + cv.width + '×' + cv.height + (resScale < 1 ? ' (' + Math.round(resScale * 100) + '%)' : '') + '</em>';
  if (AUTORES && !bench && !diag) {
    const ns = fps < 50 ? Math.max(0.6, resScale - 0.1) : fps > 58 ? Math.min(1, resScale + 0.05) : resScale;
    if (ns !== resScale) { resScale = ns; applyDpr(); }
  }
  acc = { f: 0, t: 0, js: 0 };
}
function loop(now) {
  requestAnimationFrame(loop);
  const wall = performance.now(), rawMs = wall - (loop.prev || wall); loop.prev = wall;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; frameNo++;
  const j0 = performance.now();
  lodT -= dt; if (lodT <= 0) { updateLod(); lodT = 0.25; }
  active.forEach((c, i) => { c.acc += dt; if (P.farHalf && c.curLod === 1 && (frameNo + i) % 2) return; animClerk(c, L.desks[i], c.acc, i); c.acc = 0; });
  if (BATCHED) { carrIM.instanceMatrix.needsUpdate = true; paperIM.instanceMatrix.needsUpdate = true; }
  const js = performance.now() - j0;
  if (bench) {
    bench.t = (wall - bench.start) / 1000; if (rawMs >= 1) bench.frames.push(rawMs);
    const a = bench.t / 20 * Math.PI * 2, r = Math.max(L.W, L.D) * 0.38;
    camera.position.set(Math.sin(a) * r, 2.7, Math.cos(a) * r); camera.lookAt(0, 0.6, -0.6);
    if (bench.t >= 20) endBench();
  } else if (diag) { diag.t = (wall - diag.start) / 1000; if (diag.t > 0.6 && rawMs >= 1) diag.frames.push(rawMs); if (diag.t >= 5) diagNext(); }
  else controls.update();
  const r0 = performance.now(); renderer.render(scene, camera); const cpu = js + performance.now() - r0;
  acc.f++; acc.t += dt; acc.js += js; acc.cpu = (acc.cpu || 0) + cpu; if (diag) diag.cpu.push(cpu);
  if (acc.t >= 0.5) updateStats();
}
function startBench() { resScale = AUTORES ? resScale : 1; bench = { t: 0, start: performance.now(), frames: [] }; controls.enabled = false; resEl.innerHTML = '<span>RUNNING… 20 s</span>'; document.body.classList.add('busy'); }
function endBench() {
  const f = bench.frames.slice(30).filter(x => x >= 1).sort((a, b) => a - b); if (!f.length) f.push(NaN);
  const avg = 1000 / (f.reduce((s, x) => s + x, 0) / f.length), low = 1000 / f[Math.floor(f.length * 0.99)];
  const verdict = avg >= 55 && low >= 40 ? ['SMOOTH', 'This preset is safe on this machine.', '#5CFF8A'] : avg >= 40 ? ['PLAYABLE', 'OK, but weaker machines should use the preset below.', '#FFB347'] : ['TOO HEAVY', 'Drop one preset on this machine.', '#FF6A5C'];
  resEl.innerHTML = '<b style="color:' + verdict[2] + '">' + verdict[0] + '</b><span>' + presetKey.toUpperCase() + ' · ' + COUNT + ' PLAYERS · ' + (BATCHED ? 'BATCHED' : 'NAIVE') + '</span><span>AVG ' + fmt(avg) + ' FPS · 1% LOW ' + fmt(low) + ' FPS</span><i>' + verdict[1] + '</i>';
  bench = null; controls.enabled = true; document.body.classList.remove('busy'); setView(VIEW);
}

// ---- Bottleneck finder: 5 short runs, one change each, fixed camera ----
function setShadows(on) { renderer.shadowMap.enabled = on; sun.castShadow = on; [matL, matS, paperMat].forEach(m => m.needsUpdate = true); }
function clerksVisible(on) {
  if (BATCHED) bm.visible = on; else active.forEach(c => PARTS.forEach(p => c.mesh[p].visible = on));
  active.forEach(c => c.curLod = -1); lodT = 0;
}
const DIAG = [
  { name: 'BASELINE', on() {}, off() {} },
  { name: 'NO SHADOWS', on() { setShadows(false); }, off() { setShadows(P.shadows); } },
  { name: 'RESOLUTION 1.0', on() { renderer.setPixelRatio(1); }, off() { applyDpr(); } },
  { name: 'NO ANTI-ALIAS', on() { P = { ...P, aa: false }; makeRenderer(); }, off() { P = PRESETS[presetKey]; makeRenderer(); } },
  { name: 'NO CLERKS', on() { clerksVisible(false); }, off() { clerksVisible(true); } },
];
const median = a => { const s = a.filter(x => x >= 1 && isFinite(x)).sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : NaN; };
const fmt = f => isFinite(f) ? f.toFixed(0) : 'n/a';
function startDiag() {
  resScale = 1; applyDpr(); setView('over'); controls.enabled = false;
  diag = { i: 0, t: 0, start: performance.now(), frames: [], out: [], cpu: [] }; DIAG[0].on();
  document.body.classList.add('busy'); resEl.innerHTML = '<span>FINDING BOTTLENECK… 1/' + DIAG.length + '</span>';
}
function diagNext() {
  const s = DIAG[diag.i]; diag.out.push({ name: s.name, fps: 1000 / median(diag.frames) }); s.off();
  diag.i++; diag.t = 0; diag.start = performance.now(); diag.frames = [];
  if (diag.i < DIAG.length) { DIAG[diag.i].on(); resEl.innerHTML = '<span>FINDING BOTTLENECK… ' + (diag.i + 1) + '/' + DIAG.length + '</span>'; return; }
  const base = diag.out[0].fps, rows = diag.out.slice(1).map(o => ({ ...o, gain: isFinite(o.fps / base) ? o.fps / base - 1 : 0 })).sort((a, b) => b.gain - a.gain);
  const top = rows[0], tip = {
    'NO SHADOWS': 'Shadows are the cost → Medium should use blob shadows or a 512 map updated every other frame.',
    'RESOLUTION 1.0': 'Pixel count is the cost (fill-rate) → cap resolution at 1.0 and turn on AUTO RES.',
    'NO ANTI-ALIAS': 'Anti-aliasing is the cost → use FXAA or no AA on this class of GPU.',
    'NO CLERKS': 'The clerks themselves are the cost → raise LOD1 distance / fewer full-detail seats.',

  const capped = spread < 0.2 && (Math.abs(base - 30) < 6 || Math.abs(base - 60) < 4 && base < 58) && cpuMs < 12;
  resEl.innerHTML = '<b style="color:#E8DCC0">BASELINE ' + fmt(base) + ' FPS · CPU ' + (isFinite(cpuMs) ? cpuMs.toFixed(1) : 'n/a') + ' ms</b>' +
    rows.map(o => '<span>' + o.name + ' → ' + fmt(o.fps) + ' FPS (' + (o.gain >= 0 ? '+' : '') + Math.round(o.gain * 100) + '%)</span>').join('') +
    '<i>' + (capped
      ? 'FRAME-RATE CAP DETECTED: every test lands at the same FPS while the CPU is mostly idle. The browser is limiting this page, not the GPU. Plug in the charger, turn off Chrome Energy Saver / macOS Low Power Mode, open the file in its own tab, click inside it, then rerun.'
      : top.gain > 0.15 ? tip : 'No single big cost — the GPU is simply at its limit; use LOW + AUTO RES.') + '</i>';
  diag = null; controls.enabled = true; document.body.classList.remove('busy');
}

// ---- UI ----
function rebuild(full) { if (full) makeRenderer(); buildWorld(); setView(VIEW); document.getElementById('pdesc').textContent = P.desc; }
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || bench) return;
  seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  const k = seg.dataset.k, val = b.dataset.v;
  if (k === 'preset') { presetKey = val; P = PRESETS[val]; rebuild(true); }
  if (k === 'count') { COUNT = +val; rebuild(false); }
  if (k === 'mode') { BATCHED = val === 'batched'; rebuild(false); }
  if (k === 'view') setView(val);
  if (k === 'auto') { AUTORES = val === 'on'; if (!AUTORES) { resScale = 1; applyDpr(); } }
}));
document.getElementById('bench').onclick = () => { if (!bench && !diag) startBench(); };
document.getElementById('diag').onclick = () => { if (!bench && !diag) startDiag(); };
makeRenderer(); rebuild(false);
requestAnimationFrame(loop);
</script>
