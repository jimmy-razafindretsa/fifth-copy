<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2B2C2A;overflow:hidden;font-family:'Share Tech Mono',monospace;color:#C9C6B8}
a{color:#E8DCC0}a:hover{color:#fff}
canvas{position:fixed;inset:0;display:block}
.plate{position:fixed;left:20px;top:16px;z-index:5;display:flex;flex-direction:column;gap:8px}
.plate h1{margin:0;font:700 24px 'Stardos Stencil',serif;letter-spacing:.08em;color:#E8DCC0;white-space:nowrap}
.plate p{margin:0;font-size:12px;letter-spacing:.12em;color:#8E8C80;white-space:nowrap}
.ctl{display:flex;flex-direction:column;gap:6px}
.grp{display:flex;align-items:center;gap:8px}
.grp>span{width:74px;font-size:10px;letter-spacing:.16em;color:#8E8C80}
.seg{display:flex}
.seg button{font:12px 'Share Tech Mono',monospace;background:rgba(27,29,27,.85);color:#C9C6B8;border:1px solid #55574f;margin-left:-1px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#E8DCC0;color:#23201D;border-color:#E8DCC0;position:relative}
.plate,.stats{display:none!important}
canvas{filter:sepia(.1) saturate(.92) contrast(1.03)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(24,18,10,.32) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:4;opacity:.06;mix-blend-mode:overlay;animation:grain .6s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-7%,4%)}40%{transform:translate(5%,-6%)}60%{transform:translate(-3%,8%)}80%{transform:translate(8%,2%)}100%{transform:translate(0,0)}}
.stats{position:fixed;right:16px;bottom:14px;z-index:5;font-size:11px;letter-spacing:.1em;color:#8E8C80;white-space:nowrap}
</style>

<body>
<div id="root" class="plate">
  <h1>THE RING ROOM</h1>
  <p>30 DESKS · THE MAJOR STANDS AT THE CENTRE · ONE DIRTY BULB</p>
  <div class="ctl">
    <div class="grp"><span>VIEW</span><div class="seg" data-k="view"><button data-v="over" class="on">OVERVIEW</button><button data-v="pov">SEAT POV</button><button data-v="free">FREE</button></div></div>
    <div class="grp"><span>PLATFORM</span><div class="seg" data-k="plat"><button data-v="on" class="on">TURNING</button><button data-v="off">STILL</button></div></div>
    <div class="grp"><span>BULB</span><div class="seg" data-k="bulb"><button data-v="on" class="on">STUTTERS</button><button data-v="off">STEADY</button></div></div>
    <div class="grp"><span>SHADOWS</span><div class="seg" data-k="shadow"><button data-v="off" class="on">OFF</button><button data-v="on">ON</button></div></div>
  </div>
</div>
<div class="vig"></div><div class="grain" id="grain"></div>
<div class="stats" id="stats"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- palette (Art Direction: backroom grey, only red = flags) ----------
const COL = {
  floor: 0x77746C, floorIn: 0x837F76, seam: 0x67645D, wall: 0x949A8E, wains: 0x63655B, trim: 0x52534A, pillar: 0x80857A, ceil: 0x55574F,
  steel: 0x7D8A83, steelD: 0x5C6660, tw: 0x2F3A2E, key: 0xE8DCC0, chair: 0x4E3424, brass: 0xB8933F, red: 0xB81D24, banner: 0x7E1015,
  gold: 0xE2B23A, ink: 0x2A2420, paper: 0xE4D6B8, wood: 0x4E3424, leather: 0x2B1E16, glass: 0xCFE0DC, beige: 0xC9C2AE, cab: 0x60645D, enamel: 0x2F5A40,
};
const N = 30, R_CHAIR = 6.9, WALL_R = 10, H = 5.5, DESK_Y = 0.44;
const S = (r, w = 8, h = 6) => new THREE.SphereGeometry(r, w, h);
const C = (rt, rb, h, s = 8, open = false) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open);
const B = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const part = (g, geo, col, x, y, z) => { const m = new THREE.Mesh(geo); m.userData.col = col; m.position.set(x, y, z); g.add(m); return m; };

function flip(g) { const i = g.index.array; for (let k = 0; k < i.length; k += 3) { const t = i[k]; i[k] = i[k + 2]; i[k + 2] = t; } const n = g.attributes.normal.array; for (let k = 0; k < n.length; k++) n[k] *= -1; }
function merge(root) {
  root.updateMatrixWorld(true);
  const pos = [], nor = [], col = [], idx = [], c = new THREE.Color();
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.clone();
    if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
    if (g.type === 'LatheGeometry') { const p = g.attributes.position, n = g.attributes.normal, i = Math.floor(p.count / 2); if (p.getX(i) * n.getX(i) + p.getZ(i) * n.getZ(i) < 0) flip(g); }
    if (o.userData.flip) flip(g);
    g.applyMatrix4(o.matrixWorld);
    c.setHex(o.userData.col).convertSRGBToLinear();
    const base = pos.length / 3, p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
    for (const i of g.index.array) idx.push(base + i);
    g.dispose(); o.geometry.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  out.setIndex(idx); out.computeBoundingSphere();
  return out;
}

// ---------- one desk station (clerk seat at origin, facing +z) ----------
function desk(i) {
  const g = new THREE.Group(), P = (geo, c, x, y, z) => part(g, geo, c, x, y, z);
  P(B(1.2, 0.04, 0.6), COL.steel, 0, DESK_Y - 0.02, 0.6);
  P(B(0.34, DESK_Y - 0.04, 0.54), COL.steelD, 0.4, (DESK_Y - 0.04) / 2, 0.6);
  [0.3, 0.17].forEach(y => P(B(0.28, 0.006, 0.01), COL.ink, 0.4, y, 0.33));
  [0.34, 0.86].forEach(z => P(B(0.04, DESK_Y - 0.04, 0.04), COL.steelD, -0.56, (DESK_Y - 0.04) / 2, z));
  P(B(1.1, 0.24, 0.02), COL.steelD, 0, DESK_Y - 0.16, 0.88);
  // chair
  P(B(0.42, 0.04, 0.4), COL.chair, 0, 0.26, -0.06);
  [[-0.18, 0.1], [0.18, 0.1], [-0.18, -0.22], [0.18, -0.22]].forEach(([x, z]) => P(C(0.018, 0.018, 0.24, 5), COL.wood, x, 0.12, z));
  [-0.18, 0.18].forEach(x => P(C(0.018, 0.018, 0.44, 5), COL.wood, x, 0.48, -0.27));
  P(B(0.42, 0.12, 0.025), COL.chair, 0, 0.62, -0.27);
  // typewriter
  P(B(0.46, 0.035, 0.3), COL.tw, 0, DESK_Y + 0.0175, 0.47);
  P(B(0.4, 0.03, 0.15), COL.tw, 0, DESK_Y + 0.05, 0.38).rotation.x = 0.25;
  P(B(0.44, 0.11, 0.16), COL.tw, 0, DESK_Y + 0.09, 0.55);
  [-1, 1].forEach(s => P(B(0.03, 0.06, 0.1), COL.tw, s * 0.23, DESK_Y + 0.16, 0.56));
  for (let r = 0; r < 4; r++) for (let c = 0; c < 10; c++) P(C(0.012, 0.012, 0.014, 6), COL.key, -0.15 + c * 0.033 + r * 0.008, DESK_Y + 0.062 + r * 0.014, 0.34 + r * 0.03);
  // a little clutter per desk
  const h = hash(i);
  if (h < 0.45) { P(C(0.06, 0.05, 0.02, 10), 0x3A3C38, -0.45, DESK_Y + 0.01, 0.42); P(C(0.006, 0.006, 0.06, 4), 0xF1E8D6, -0.43, DESK_Y + 0.025, 0.42).rotation.z = Math.PI / 2; }
  if (h > 0.3) P(B(0.2, 0.03 + hash(i + 1) * 0.05, 0.27), COL.paper, 0.42, DESK_Y + 0.03, 0.66);
  if (h > 0.7) { P(C(0.03, 0.026, 0.08, 8), COL.glass, -0.42, DESK_Y + 0.04, 0.7); P(C(0.034, 0.03, 0.05, 8), COL.brass, -0.42, DESK_Y + 0.025, 0.7); }
  if (hash(i + 3) > 0.6) { P(C(0.03, 0.03, 0.015, 8), COL.ink, -0.3, DESK_Y + 0.008, 0.75); P(C(0.012, 0.012, 0.05, 6), COL.wood, -0.3, DESK_Y + 0.04, 0.75); P(S(0.018, 6, 4), COL.wood, -0.3, DESK_Y + 0.07, 0.75); }
  return g;
}

// ---------- wall pieces (local: on the wall, facing +z toward centre) ----------
function flag(g) {
  part(g, B(1.1, 2.2, 0.03), COL.red, 0, 3.2, 0);
  part(g, B(1.1, 0.06, 0.035), COL.banner, 0, 2.1, 0);
  part(g, C(0.22, 0.22, 0.035, 16), COL.gold, 0, 3.65, 0.02).rotation.x = Math.PI / 2;
  part(g, C(0.025, 0.025, 1.4, 6), COL.brass, 0, 4.33, 0.05).rotation.z = Math.PI / 2;
  [-1, 1].forEach(s => part(g, S(0.05, 6, 4), COL.brass, s * 0.72, 4.33, 0.05));
}
function portrait(g) {
  part(g, B(1.4, 1.8, 0.08), 0x8A6A2A, 0, 3.3, 0);
  part(g, B(1.18, 1.58, 0.09), COL.ink, 0, 3.3, 0.005);
  part(g, B(0.5, 0.04, 0.1), COL.brass, 0, 4.3, 0.1);
}
function cabinets(g) {
  [-0.32, 0.32].forEach(x => {
    part(g, B(0.58, 1.35, 0.6), COL.cab, x, 0.675, 0.32);
    for (let k = 0; k < 4; k++) { part(g, B(0.14, 0.02, 0.03), COL.brass, x, 0.22 + k * 0.32, 0.63); part(g, B(0.09, 0.04, 0.008), COL.paper, x, 0.28 + k * 0.32, 0.625); }
  });
  part(g, B(0.3, 0.12, 0.22), COL.paper, -0.3, 1.41, 0.3);
}
function samovarTable(g) {
  part(g, C(0.42, 0.42, 0.04, 14), COL.wood, 0, 0.75, 0.55);
  part(g, C(0.04, 0.06, 0.73, 8), COL.wood, 0, 0.37, 0.55);
  part(g, C(0.22, 0.26, 0.03, 14), COL.brass, 0, 0.78, 0.55);
  const prof = [[0, 0], [0.06, 0], [0.08, 0.04], [0.06, 0.08], [0.14, 0.12], [0.16, 0.26], [0.12, 0.36], [0.07, 0.38], [0.05, 0.44], [0, 0.44]];
  part(g, new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 12), COL.brass, 0, 0.795, 0.55);
  part(g, C(0.02, 0.02, 0.1, 6), COL.brass, 0, 1.28, 0.55);
  part(g, B(0.08, 0.015, 0.015), COL.brass, 0, 0.95, 0.72);
  [-1, 1].forEach(s => part(g, new THREE.TorusGeometry(0.05, 0.01, 4, 10, Math.PI), COL.ink, s * 0.17, 1.05, 0.55).rotation.z = s * -Math.PI / 2);
  [0.25, -0.25].forEach(x => { part(g, C(0.03, 0.026, 0.08, 8), COL.glass, x, 0.81, 0.4); part(g, C(0.034, 0.03, 0.05, 8), COL.brass, x, 0.795, 0.4); });
}

// ---------- build the static room ----------
const room = new THREE.Group();
part(room, C(WALL_R, WALL_R, 0.1, 64), COL.floor, 0, -0.05, 0);
part(room, C(5.4, 5.4, 0.012, 64), COL.floorIn, 0, 0.006, 0);
for (let k = 0; k < 16; k++) { const s = part(room, B(0.02, 0.004, WALL_R * 2), COL.seam, 0, 0.003, 0); s.rotation.y = k / 16 * Math.PI; }
part(room, C(WALL_R, WALL_R, H, 64, true), COL.wall, 0, H / 2, 0).userData.flip = true;
part(room, C(WALL_R - 0.04, WALL_R - 0.04, 1.1, 64, true), COL.wains, 0, 0.55, 0).userData.flip = true;
part(room, C(WALL_R - 0.06, WALL_R - 0.06, 0.08, 64, true), COL.trim, 0, 1.12, 0).userData.flip = true;
part(room, C(WALL_R, WALL_R, 0.1, 64), COL.ceil, 0, H + 0.05, 0);
for (let k = 0; k < 10; k++) {
  const a = (k + 0.5) / 10 * Math.PI * 2, p = part(room, B(0.6, H, 0.5), COL.pillar, Math.sin(a) * (WALL_R - 0.22), H / 2, Math.cos(a) * (WALL_R - 0.22)); p.rotation.y = a;
}
const WALL_SLOTS = { 0: portrait, 2: flag, 3: flag, 7: flag, 8: flag, 1: cabinets, 4: cabinets, 6: cabinets, 9: cabinets, 5: samovarTable };
Object.entries(WALL_SLOTS).forEach(([k, fn]) => {
  const a = k / 10 * Math.PI * 2, g = new THREE.Group(); g.position.set(Math.sin(a) * (WALL_R - 0.08), 0, Math.cos(a) * (WALL_R - 0.08)); g.rotation.y = a + Math.PI; fn(g); room.add(g);
});
for (let i = 0; i < N; i++) {
  const a = i / N * Math.PI * 2, g = desk(i); g.position.set(Math.sin(a) * R_CHAIR, 0, Math.cos(a) * R_CHAIR); g.rotation.y = a + Math.PI; room.add(g);
}
// litter: paper scraps, dockets and cigarette butts on the floor
for (let k = 0; k < 45; k++) {
  const a = hash(k * 3.3) * Math.PI * 2, r = 1.8 + hash(k * 5.1) * 7.6, x = Math.sin(a) * r, z = Math.cos(a) * r;
  if (hash(k * 7.7) < 0.55) { const s = part(room, B(0.08 + hash(k) * 0.12, 0.003, 0.06 + hash(k + 2) * 0.1), hash(k + 4) < 0.5 ? 0xCFC3A6 : 0xB9AE92, x, 0.004, z); s.rotation.y = hash(k + 8) * 6.3; }
  else { const b = part(room, C(0.006, 0.006, 0.03, 4), 0xD8CFC0, x, 0.007, z); b.rotation.z = Math.PI / 2; b.rotation.y = hash(k + 9) * 6.3; }
}
// bulb cord + enamel shade (outer + inner face)
part(room, C(0.01, 0.01, H - 3.45, 4), COL.ink, 0, (H + 3.45) / 2, 0);
part(room, C(0.12, 0.55, 0.32, 16, true), COL.enamel, 0, 3.4, 0);
part(room, C(0.115, 0.545, 0.31, 16, true), 0xD8D2C0, 0, 3.4, 0).userData.flip = true;
part(room, C(0.13, 0.13, 0.04, 10), COL.enamel, 0, 3.57, 0);

// ---------- the Major's turning platform ----------
const plat = new THREE.Group();
part(plat, C(1.5, 1.6, 0.3, 32), COL.steelD, 0, 0.15, 0);
part(plat, C(1.53, 1.53, 0.04, 32), COL.brass, 0, 0.29, 0);
part(plat, C(1.45, 1.45, 0.02, 32), 0x4A4E48, 0, 0.31, 0);
const TOP = 0.31;
// The Major stands here, watching. Brass footplate marks his spot; period props around him.
part(plat, C(0.42, 0.42, 0.012, 20), COL.brass, 0, TOP + 0.006, 0);
part(plat, C(0.36, 0.36, 0.014, 20), 0x3A3C38, 0, TOP + 0.008, 0);
const tx = 0.62, tz = 0.12;
part(plat, C(0.2, 0.2, 0.03, 14), COL.wood, tx, TOP + 0.72, tz);
part(plat, C(0.025, 0.035, 0.7, 6), COL.wood, tx, TOP + 0.36, tz);
part(plat, C(0.14, 0.14, 0.02, 10), COL.wood, tx, TOP + 0.01, tz);
const D = TOP + 0.735;
part(plat, C(0.022, 0.018, 0.05, 8), COL.glass, tx + 0.1, D + 0.025, tz - 0.08);
part(plat, C(0.06, 0.05, 0.02, 10), 0x3A3C38, tx - 0.02, D + 0.01, tz + 0.12);
part(plat, B(0.5, 0.45, 0.4), 0x5A4A36, -0.75, TOP + 0.225, -0.45);
part(plat, B(0.38, 0.32, 0.34), COL.beige, -0.75, TOP + 0.61, -0.45);
part(plat, B(0.42, 0.3, 0.32), 0x8A7B5C, 0.7, TOP + 0.15, -0.6);
part(plat, B(0.36, 0.06, 0.26), COL.paper, 0.7, TOP + 0.33, -0.6);

// film grain tile (CSS overlay, no GPU cost in the 3D pass)
{ const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'), d = g.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); document.getElementById('grain').style.background = 'url(' + c.toDataURL() + ')'; }
// ---------- renderer, lights, materials ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const EMBED = new URLSearchParams(location.search).has('embed');
renderer.setPixelRatio(EMBED ? 1 : Math.min(devicePixelRatio, 1.25)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x4A4C47); scene.fog = new THREE.Fog(0x4A4C47, 20, 42);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxDistance = 9.2; controls.maxPolarAngle = Math.PI * 0.48; controls.target.set(0, 0.8, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const mat = new THREE.MeshLambertMaterial({ vertexColors: true }); mat.name = 'room_vertex_colour';
// ---- age & grime: one tileable noise texture, triplanar in the room shader (no extra draw calls) ----
const grimeTex = (() => {
  const N2 = 256, cv = document.createElement('canvas'); cv.width = cv.height = N2; const g = cv.getContext('2d'), img = g.createImageData(N2, N2);
  const grid = (n, seed) => { const a = []; for (let i = 0; i < n * n; i++) a.push(hash(i * 1.37 + seed)); return a; };
  const vn = (a, n, x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, s = t => t * t * (3 - 2 * t);
    const v = (i, j) => a[((j % n + n) % n) * n + ((i % n + n) % n)];
    const top = v(xi, yi) + (v(xi + 1, yi) - v(xi, yi)) * s(fx), bot = v(xi, yi + 1) + (v(xi + 1, yi + 1) - v(xi, yi + 1)) * s(fx); return top + (bot - top) * s(fy); };
  const oct = [[4, grid(4, 1)], [8, grid(8, 2)], [16, grid(16, 3)], [32, grid(32, 4)], [64, grid(64, 5)]];
  const st = grid(48, 9);
  for (let y = 0; y < N2; y++) for (let x = 0; x < N2; x++) {
    let r = 0, amp = 0.5; for (let k = 0; k < 4; k++) { const [n, a] = oct[k]; r += vn(a, n, x / N2 * n, y / N2 * n) * amp; amp *= 0.5; }
    const gr = vn(oct[4][1], 64, x / N2 * 64, y / N2 * 64);
    const sb = vn(st, 48, x / N2 * 48, y / N2 * 3);
    const i = (y * N2 + x) * 4; img.data[i] = r * 255 / 0.94; img.data[i + 1] = gr * 255; img.data[i + 2] = sb * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace; return t;
})();
function dirty(m, amt) {
  m.onBeforeCompile = sh => {
    sh.uniforms.uGrime = { value: grimeTex }; sh.uniforms.uAmt = { value: amt };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP; varying vec3 vWN;')

  if (t > H.next) { const g = GLANCES[Math.floor(Math.random() * GLANCES.length)]; H.tx = g[0]; H.ty = g[1]; H.next = t + 2 + Math.random(); H.back = t + 1; if (Math.random() < 0.6) E.blink = t + 0.05; }
  if (H.back && t > H.back) { H.tx = 0.28; H.ty = 0; H.back = 0; }
  const ease = 1 - Math.exp(-dt * 4); H.x += (H.tx - H.x) * ease; H.y += (H.ty - H.y) * ease;
  if (t > E.sacc) { E.sacc = t + 0.4 + Math.random() * 0.8; E.jx = (Math.random() - 0.5) * 0.004; E.jy = (Math.random() - 0.5) * 0.003; }

let lodT = 0;
function updateLod() {
  const order = active.map((c, i) => [camera.position.distanceToSquared(L.desks[i]), i]).sort((a, b) => a[0] - b[0]);
  order.forEach(([, i], rank) => {
    const c = active[i], lod = rank < P.near ? 0 : 1; if (lod === c.curLod) return; c.curLod = lod;
    ['body', 'head', 'armL', 'armR'].forEach(p => { if (BATCHED) bm.setGeometryIdAt(c.inst[p], c.ids[p][lod]); else c.mesh[p].geometry = lod ? c.geos[p].g1 : c.geos[p].g0; });
    setVis(c, 'eyes', lod === 0); setVis(c, 'lids', false);
  });
}


function init(n, RC) {
  for (let i = 0; i < n; i++) pool.push(makeClerk(i)); active = pool;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, p = new THREE.Vector3(Math.sin(a) * RC, 0, Math.cos(a) * RC);
    deskM.push(new THREE.Matrix4().compose(p, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), a + Math.PI), new THREE.Vector3(1, 1, 1))); L.desks.push(p);
  }
  carrIM = new THREE.InstancedMesh(merge(carriage()), cmat, n); paperIM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.26, 0.24, 0.003), pmat, n);
  carrIM.frustumCulled = paperIM.frustumCulled = false;
  let v = 0, ix = 0, cnt = 0;
  active.forEach(c => PARTS.forEach(p => { [c.geos[p].g0, c.geos[p].g1].forEach(g => { if (g) { v += g.attributes.position.count; ix += g.index.count; } }); cnt++; }));
  bm = new THREE.BatchedMesh(cnt, v, ix, cmat); bm.frustumCulled = false;
  active.forEach(c => { c.ids = {}; c.inst = {}; c.curLod = 0; PARTS.forEach(p => { const g = c.geos[p]; const i0 = bm.addGeometry(g.g0), i1 = g.g1 ? bm.addGeometry(g.g1) : -1; c.ids[p] = [i0, i1]; c.inst[p] = bm.addInstance(i0); }); });
  scene.add(bm, carrIM, paperIM);
}
function update(dt, hide0) {
  HIDE0 = hide0;
  lodT -= dt; if (lodT <= 0) { updateLod(); lodT = 0.25; }
  active.forEach((c, i) => { DM.copy(deskM[i]); animClerk(c, ZERO, dt, i); });
  carrIM.instanceMatrix.needsUpdate = true; paperIM.instanceMatrix.needsUpdate = true;
  const c0 = active[0];
  if (hide0) PARTS.forEach(p => bm.setVisibleAt(c0.inst[p], false));
  else if (was0) { ['body', 'head', 'armL', 'armR'].forEach(p => bm.setVisibleAt(c0.inst[p], true)); bm.setVisibleAt(c0.inst.eyes, c0.curLod === 0); }
  was0 = hide0;

})();
Clerks.init(N, R_CHAIR);

// ---------- dust motes drifting in the bulb light ----------
const DUST = 220, dustPos = new Float32Array(DUST * 3), dustSeed = [];
for (let i = 0; i < DUST; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 3.2; dustSeed.push([a, r, 0.4 + Math.random() * 2.8, Math.random() * 6.283]); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xFFE7C2, size: 0.018, transparent: true, opacity: 0.55, depthWrite: false }));
dust.frustumCulled = false; scene.add(dust);
function dustUpdate(t) {
  for (let i = 0; i < DUST; i++) { const [a, r, y, p] = dustSeed[i]; const aa = a + t * 0.02 + Math.sin(t * 0.3 + p) * 0.05;
    dustPos[i * 3] = Math.sin(aa) * r; dustPos[i * 3 + 1] = ((y + t * 0.03 + Math.sin(t * 0.4 + p) * 0.08) % 3.2) + 0.2; dustPos[i * 3 + 2] = Math.cos(aa) * r; }
  dustGeo.attributes.position.needsUpdate = true;
}

// ---------- behaviour ----------
let FORCE = null;
addEventListener('message', e => { const d = e.data || {}; if (d.type === 'fc-setview') FORCE = d.view === 'auto' ? null : d.view; });
let VIEW = 'over', TURN = true, STUTTER = true, t = 0, last = performance.now(), nextStutter = 4, stutterT = -1, orbitA = 0.6;
const STUTTER_PATTERN = [[0, 0.06, 0], [0.06, 0.14, 1], [0.14, 0.2, 0], [0.2, 0.42, 0.6], [0.42, 0.5, 0], [0.5, 9, 1]];
function setView(v) {
  VIEW = v; controls.enabled = v === 'free';
  if (v === 'pov') { camera.fov = 62; camera.position.set(0, 1.02, R_CHAIR - 0.05); camera.lookAt(0, 0.95, 0); }
  if (v === 'free') { camera.fov = 55; camera.position.set(5.5, 3.2, 5.5); controls.target.set(0, 0.8, 0); controls.update(); }
  if (v === 'over') camera.fov = 55;
  camera.updateProjectionMatrix();
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  const k = seg.dataset.k, on = b.dataset.v === 'on';
  if (k === 'view') setView(b.dataset.v);
  if (k === 'plat') TURN = on;
  if (k === 'bulb') STUTTER = on;

}));

const statsEl = document.getElementById('stats'); let fr = 0, ft = 0;
function loop(now) {

  if (TURN) platG.rotation.y += dt * 0.06;
