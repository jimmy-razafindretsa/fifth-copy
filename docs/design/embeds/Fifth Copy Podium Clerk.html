// The plinth clerk (design bible 14.4 "Plinth clerk", 13 "Chest pin", #688): one player's clerk standing in

import * as THREE from 'three';
const CATS = {
  hair:    { label: 'HAIR', opts: [['side', 'Side part', 'CLERK STANDARD'], ['buzz', 'Buzz cut', 'BARRACKS'], ['quiff', 'Quiff', 'DANCE HALL'], ['bowl', 'Bowl cut', 'HOME-MADE'], ['bald', 'Bald', 'POLISHED']] },

  clothes: { label: 'CLOTHES', opts: [['vest', 'Knit vest', 'OLIVE WOOL'], ['cardigan', 'Cardigan', 'GRANDMA KNIT'], ['jacket', 'Work jacket', 'NAVY CANVAS'], ['sweater', 'Sweater', 'GREY RIB'], ['braces', 'Shirt & braces', 'SUMMER']] },
  face:    { label: 'FACE', opts: [['stache', 'Moustache', 'REGULATION'], ['clean', 'Clean shave', 'FRESH RAZOR'], ['beard', 'Full beard', 'PHILOSOPHER']] },
};
const HAIRCOL = ['#4A3526', '#1E1A17', '#A4552A', '#C9A465', '#8C8A84'];
const cfg = { hair: 'side', glasses: 'round', hat: 'none', clothes: 'vest', face: 'stache', hairCol: HAIRCOL[0] };
let tab = 'hair';

const COL = { skin: 0xF0C6A2, white: 0xF6F1E6, black: 0x161616, shirt: 0xE6DCC6, trousers: 0x55544E, shoe: 0x241914, brass: 0xB8933F, scarf: 0x2E8C8A };
const CLOTH = {
  vest: { body: 0x5E6140, sleeve: COL.shirt, gap: 1.0 }, cardigan: { body: 0x7A5638, sleeve: 0x7A5638, gap: 0.55 },
  jacket: { body: 0x34405A, sleeve: 0x34405A, gap: 0 }, sweater: { body: 0x8A8C85, sleeve: 0x8A8C85, gap: 0 }, braces: { body: null, sleeve: COL.shirt },
};
const S = (r, w = 8, h = 6) => new THREE.SphereGeometry(r, w, h);
const HS = (r, w, h, p0, pl, t0, tl) => new THREE.SphereGeometry(r, w, h, p0, pl, t0, tl);

const PEAR = [[0,0],[0.17,0.01],[0.25,0.07],[0.285,0.17],[0.275,0.27],[0.24,0.36],[0.17,0.43],[0.08,0.47],[0,0.48]];

function build(c) {
  const root = new THREE.Group();
  const part = (geo, col, x, y, z, parent = root) => { const m = new THREE.Mesh(geo); m.userData.col = col; m.position.set(x, y, z); parent.add(m); return m; };
  const hair = new THREE.Color(c.hairCol).getHex();

  if (cl.body) {

    const prof = PEAR.slice(1, top).map(([x, y]) => [x * sc + 0.004, y - (c.clothes === 'jacket' ? 0.02 : 0)]);
    const g = cl.gap ? new THREE.LatheGeometry(V2(prof), 12, cl.gap / 2, Math.PI * 2 - cl.gap) : new THREE.LatheGeometry(V2(prof), 12);
    part(g, cl.body, 0, 0.16, 0).scale.set(1, 1, 0.88);
    if (c.clothes === 'cardigan') [0.42, 0.34, 0.26].forEach(y => part(S(0.014, 4, 3), COL.brass, 0.07, y, 0.235));
    if (c.clothes === 'vest') [0.4, 0.32].forEach(y => part(S(0.012, 4, 3), COL.brass, 0, y, 0.25));

    part(S(R * 0.022, 4, 3), COL.white, ex - s * R * 0.02 + R * 0.03, ey + R * 0.04, ez + R * 0.1, eyes);
    part(S(R * 0.17, 8, 6), COL.skin, ex, ey, ez + R * 0.01, lids).scale.set(1, 1.2, 0.72);

    part(TOR(R * 0.21, R * 0.03, 4, 12), COL.brass, R * 0.35, ey, gz, h);
    part(B(R * 0.02, R * 0.7, R * 0.02), COL.brass, R * 0.55, ey - R * 0.45, gz - R * 0.05, h);
  }
  function t0() { return R * 0.04; }
  // face
  if (c.face === 'beard') part(S(R * 0.78, 10, 6), hair, 0, -R * 0.42, R * 0.28, h).scale.set(1.2, 0.85, 0.95);
  if (c.face !== 'clean') [-1, 1].forEach(s => { const m = part(CAP(R * 0.07, R * 0.16), hair, s * R * 0.13, -R * 0.3, R * 0.95, h); m.rotation.z = Math.PI / 2 + s * 0.25; });
  if (c.face !== 'beard') part(TOR(R * 0.12, R * 0.025, 4, 8, Math.PI), COL.black, 0, -R * 0.4, R * 0.9, h).rotation.z = Math.PI;

    const f = part(HS(R * 1.09, 10, 2, Math.PI / 2 - 1.0, 2.0, Math.PI * 0.16, Math.PI * 0.2), hair, 0, R * 0.04, 0, h); f.scale.set(1.06, 1, 1); f.rotation.z = -0.22; f.rotation.y = 0.12;
    part(HS(R * 1.05, 10, 3, Math.PI * 1.5 - 1.5, 3.0, Math.PI * 0.28, Math.PI * 0.32), hair, 0, R * 0.02, -R * 0.02, h).scale.set(1.06, 1, 1);
  } else if (c.hair === 'buzz') {
    part(HS(R * 1.015, 14, 5, 0, Math.PI * 2, 0, Math.PI * 0.4), hair, 0, R * 0.03, -R * 0.03, h).scale.set(1.06, 0.97, 1);
  } else if (c.hair === 'quiff') {
    part(HS(R * 1.03, 14, 4, 0, Math.PI * 2, 0, Math.PI * 0.36), hair, 0, R * 0.05, -R * 0.04, h).scale.set(1.06, 1, 1);
    const q = part(S(R * 0.45, 10, 6), hair, 0, R * 1.0, R * 0.42, h); q.scale.set(1.35, 0.75, 1.1); q.rotation.x = -0.35;
    part(HS(R * 1.05, 10, 3, Math.PI * 1.5 - 1.5, 3.0, Math.PI * 0.28, Math.PI * 0.32), hair, 0, R * 0.02, -R * 0.02, h).scale.set(1.06, 1, 1);
  } else if (c.hair === 'bowl') {
    part(HS(R * 1.07, 14, 5, 0, Math.PI * 2, 0, Math.PI * 0.42), hair, 0, R * 0.07, 0, h).scale.set(1.07, 1, 1.03);
  }
  // hats
  if (c.hat === 'ushanka') {
    const fur = 0x6B4E36, top = 0x4E3A2A;
    part(C(R * 1.12, R * 1.14, R * 0.55, 14), top, 0, R * 0.78, -R * 0.02, h);
    part(C(R * 1.16, R * 1.16, R * 0.22, 14), fur, 0, R * 0.55, -R * 0.02, h);
    part(B(R * 0.9, R * 0.3, R * 0.22), fur, 0, R * 0.78, R * 1.0, h).rotation.x = -0.25;
    [-1, 1].forEach(s => part(S(R * 0.4, 8, 6), fur, s * R * 1.0, R * 0.05, -R * 0.05, h).scale.set(0.4, 1.1, 0.9));
  } else if (c.hat === 'kepka') {
    const tw = 0x6E6A5E;
    part(S(R * 1.1, 14, 6), tw, 0, R * 0.66, -R * 0.05, h).scale.set(1.06, 0.42, 1.12);
    part(C(R * 0.7, R * 0.7, R * 0.04, 10, false, -Math.PI / 2, Math.PI), 0x5A574D, 0, R * 0.56, R * 0.78, h).scale.set(1, 1, 0.65);

    br.rotation.x = Math.PI / 2 + 0.08;
  } else if (c.hat === 'beret') {
    const b = part(S(R * 1.02, 14, 6), 0x2A3140, R * 0.1, R * 0.82, -R * 0.02, h); b.scale.set(1.18, 0.34, 1.12); b.rotation.z = -0.22;
    part(C(R * 0.03, R * 0.03, R * 0.1, 4), 0x2A3140, R * 0.06, R * 1.18, 0, h);
  }
  
  return root;
}

// Merge into one indexed vertex-coloured geometry (same pipeline as the in-game clerk)
function faceOut(g) {
  const p = g.attributes.position, n = g.attributes.normal, i = Math.floor(p.count / 2);
  if (p.getX(i) * n.getX(i) + p.getZ(i) * n.getZ(i) >= 0) return;
  const idx = g.index.array; for (let k = 0; k < idx.length; k += 3) { const t = idx[k]; idx[k] = idx[k + 2]; idx[k + 2] = t; }
  for (let k = 0; k < n.array.length; k++) n.array[k] *= -1;
}
function merge(root) {
  root.updateMatrixWorld(true);
  const pos = [], nor = [], col = [], idx = [], c = new THREE.Color();
  root.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.clone();
    if (!g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
    if (g.type === 'LatheGeometry') faceOut(g);
    g.applyMatrix4(o.matrixWorld);
    c.setHex(o.userData.col).convertSRGBToLinear();
    const base = pos.length / 3, p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
    for (const i of g.index.array) idx.push(base + i);
    g.dispose(); o.geometry.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  out.setIndex(idx); out.computeBoundingSphere();
  return out;
}



const flags = new URLSearchParams(location.search);
const root = document.documentElement;
const mat = new THREE.MeshLambertMaterial({ vertexColors: true });

// ---- the chest pin: the medal of `Fifth Copy Medal.html` (bible 13), its metal pair per variant ----

const pin = new THREE.Group();

  const s2 = new THREE.Mesh(ext(star(0.26, 0.105), 0.025, 0.006), enamel); s2.position.z = 0.045; medal.add(s2);

  // suspension ring + pentagonal ribbon block + clasp
  const loopR = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.016, 6, 16), gold); loopR.position.y = 0.56; medal.add(loopR);
  const ribTex = (() => { const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d');
    [['#7E1015', 0, 256]].forEach(([col, x, w]) => { g.fillStyle = col; g.fillRect(x, 0, w, 64); });
    [['#B81D24', 18, 220], ['#E2B23A', 96, 64], ['#3E3A78', 112, 32]].forEach(([col, x, w]) => { g.fillStyle = col; g.fillRect(x, 0, w, 64); });
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const pent = new THREE.Shape(); pent.moveTo(-0.3, 0.52); pent.lineTo(0.3, 0.52); pent.lineTo(0.3, 0.05); pent.lineTo(0, -0.1); pent.lineTo(-0.3, 0.05); pent.closePath();
  const pg = new THREE.ExtrudeGeometry(pent, { depth: 0.03, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 1 });
  { const p = pg.attributes.position, uv = pg.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + 0.3) / 0.6, (p.getY(i) + 0.1) / 0.62); }
  const ribbon = new THREE.Mesh(pg, new THREE.MeshStandardMaterial({ map: ribTex, roughness: 0.85, metalness: 0 }));
  ribbon.position.set(0, 0.62, -0.015); medal.add(ribbon);
  const clasp = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.045, 0.05), gold); clasp.position.set(0, 1.15, 0); medal.add(clasp);
}
// Chest pin (13): the disc ~0.09 across on the left breast (viewer's right), the clasp under the scarf,
// turned with the chest's curve and tipped back with it.
const PIN = { scale: 0.09, x: 0.105, y: 0.4, z: 0.272, turn: 0.34, tip: -0.24 };
pin.scale.setScalar(PIN.scale); pin.position.set(PIN.x, PIN.y, PIN.z); pin.rotation.set(PIN.tip, PIN.turn, 0);

const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let pageReduce = false;
const reduced = () => motionQuery.matches || pageReduce;
const syncMotion = () => { root.dataset.motion = reduced() ? 'reduce' : 'full'; };
motionQuery.addEventListener('change', syncMotion); syncMotion();

const char = new THREE.Group(); scene.add(char);
let C0 = null, worn = null, announce = null;
function randCfg() { const c = {}; Object.entries(CATS).forEach(([k, o]) => c[k] = o.opts[Math.floor(Math.random() * o.opts.length)][0]); c.hairCol = HAIRCOL[Math.floor(Math.random() * HAIRCOL.length)]; return c; }
function issue(given) {
  if (C0) { C0.body.remove(pin); char.clear(); [C0.body, C0.head, C0.eyes, C0.lids, C0.armL, C0.armR].forEach(m => m.geometry.dispose()); }
  const c = given || randCfg(), root = build(c), hd = root.getObjectByName('head'), piv = hd.position.clone();
  const aL = root.getObjectByName('armL'), aR = root.getObjectByName('armR'), sL = aL.position.clone(), sR = aR.position.clone();
  [aL, aR].forEach(a => { root.remove(a); a.position.set(0, 0, 0); a.rotation.set(0, 0, 0); });
  root.remove(hd); hd.position.set(0, 0, 0);
  const ey = hd.getObjectByName('eyes'), ld = hd.getObjectByName('lids'); hd.remove(ey); hd.remove(ld);
  const M = g => new THREE.Mesh(merge(g), mat);
  C0 = { body: M(root), head: M(hd), eyes: M(ey), lids: M(ld), armL: M(aL), armR: M(aR), sh: { '-1': sL, '1': sR } };
  C0.armL.position.copy(sL); C0.armR.position.copy(sR);
  C0.head.position.copy(piv); C0.head.add(C0.eyes, C0.lids); C0.lids.visible = false;
  C0.body.add(pin);
  char.add(C0.body, C0.head, C0.armL, C0.armR);
  worn = c; Object.keys(CATS).forEach(k => { document.documentElement.dataset[k] = c[k]; });
  // fc-clerk waits for the build's first drawn frame (the loop posts it): it is the plinth's ready signal
  announce = c;
}
// ?cfg=<URL-encoded JSON>: the player's saved outfit for the first frame (#687). Every id is checked against
// CATS and HAIRCOL and only those six keys are kept; anything else falls back to a random issue.
function checkCfg(v) {
  if (v === null || typeof v !== 'object' || Array.isArray(v)) return undefined;
  const c = {};
  for (const [k, o] of Object.entries(CATS)) { if (!o.opts.some(x => x[0] === v[k])) return undefined; c[k] = v[k]; }
  if (!HAIRCOL.includes(v.hairCol)) return undefined;
  c.hairCol = v.hairCol; return c;
}
function cfgFlag() {
  let v; try { v = JSON.parse(flags.get('cfg')); } catch { return undefined; }
  return checkCfg(v);
}
issue(cfgFlag());

// ---- gestures: a salute first, then the idle set every few seconds; an outfit change = tryon ----
const ARM = 0.2, DOWN = new THREE.Vector3(0, -1, 0), _v = new THREE.Vector3(), tgt = { '-1': new THREE.Vector3(), '1': new THREE.Vector3() };
const restOf = (s, out) => out.set(0.25 * s + s * Math.sin(0.35) * ARM, 0.5 - Math.cos(0.35) * ARM, 0.01);
function aim(s, target) {
  const arm = s < 0 ? C0.armL : C0.armR; _v.subVectors(target, C0.sh[s]); const len = _v.length(); _v.normalize();
  arm.quaternion.setFromUnitVectors(DOWN, _v); arm.scale.set(1, 1, 1);
}
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const bell = (u, a, b) => Math.sin(Math.PI * sm((u - a) / (b - a)));
const ACTS = {
  wave: { d: 2.0, f(u, o) { const w = bell(u, 0, 2.0); tgt[1].lerp(new THREE.Vector3(0.38 + Math.sin(u * 16) * 0.05 * w, 0.74, 0.08), w); o.hy = -0.15 * w; o.hx = 0.25 * w; } },
  stretch: { d: 2.2, f(u, o) { const w = bell(u, 0, 2.2); tgt[1].lerp(new THREE.Vector3(0.22, 0.86, 0.02), w); tgt[-1].lerp(new THREE.Vector3(-0.22, 0.86, 0.02), w); o.sy = 1 + 0.05 * w; o.hy = -0.3 * w; o.lock = w; } },
  look: { d: 2.4, f(u, o) { const w = bell(u, 0, 2.4); o.hx = (u < 1.2 ? -0.7 : 0.7) * w; o.lock = w; } },
  salute: { d: 1.8, f(u, o) { const w = bell(u, 0, 1.8); tgt[1].lerp(new THREE.Vector3(0.14, 0.9, 0.17), w); o.hy = -0.05 * w; o.lock = w * 0.8; } },
  scratch: { d: 2.0, f(u, o) { const w = bell(u, 0, 2.0); tgt[-1].lerp(new THREE.Vector3(-0.2 + Math.sin(u * 22) * 0.015 * w, 0.95, 0.06), w); o.hz = 0.12 * w; o.lock = w * 0.6; } },
  tryon: { d: 0.55, f(u, o) { o.sy = 1 - 0.09 * bell(u, 0, 0.22) + 0.07 * bell(u, 0.22, 0.55); o.sx = 2 - o.sy; o.y = 0.05 * bell(u, 0.2, 0.5); } },
};
const IDLE = ['wave', 'stretch', 'look', 'salute', 'scratch'];
// the salute opens within a second of the first frame (14.4), then the idle set every 3-6 s (10.2)
let act = null, actT = 0, nextIdle = 0.6, actState = {}, saluted = false;
function play(name) { act = name; actT = 0; actState = {}; }

const same = (a, b) => !!a && !!b && Object.keys(a).every(k => a[k] === b[k]);
let hx = 0, hy = 0, blinkAt = 1.5, bt = -1, t = 0, last = performance.now(), frame = 0;
// Only the embedding page at this page's own origin may drive the clerk (bible 15, #687).
addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== parent) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'fc-setcfg') { const c = checkCfg(d.cfg); if (c && !same(c, worn)) { issue(c); if (!reduced()) play('tryon'); } }
  if (d.type === 'fc-medal-variant' && isVariant(d.variant)) setVariant(d.variant);
  if (d.type === 'fc-motion' && typeof d.reduce === 'boolean') { pageReduce = d.reduce; syncMotion(); }
});
function loop(now) {
  frame = document.hidden ? 0 : requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const k = 1 - Math.exp(-dt * 5);
  const still = reduced();
  // gesture layer (none under reduced motion: the clerk stands at rest, only blinking)
  restOf(-1, tgt[-1]); restOf(1, tgt[1]);
  const o = Object.assign(actState, { y: 0, sy: 1, sx: 1, hx: 0, hy: 0, hz: 0, lock: 0 });
  if (still) act = null;
  else if (!act && t > nextIdle) { play(saluted ? IDLE[Math.floor(Math.random() * IDLE.length)] : 'salute'); saluted = true; }
  if (act) { ACTS[act].f(actT, o); actT += dt; if (actT > ACTS[act].d) { act = null; nextIdle = t + 3 + Math.random() * 3; } }
  aim(-1, tgt[-1]); aim(1, tgt[1]);
  char.position.y = o.y; char.scale.set(o.sx, o.sy, o.sx);
  hx += (0 - hx) * k; hy += (0 - hy) * k;
  const lx = hx * (1 - o.lock) + o.hx, ly = hy * (1 - o.lock) + o.hy;
  C0.head.rotation.set(ly, lx * 0.75, o.hz);
  C0.body.scale.set(still ? 1 : 1 + Math.sin(t * 1.6) * 0.008, 1, 1);
  if (t > blinkAt) { bt = t; blinkAt = t + 2 + Math.random() * 3; }
  const bp = (t - bt) / 0.15, lid = bp >= 0 && bp <= 1 ? Math.sin(bp * Math.PI) : 0;
  C0.lids.visible = lid > 0.01; C0.lids.scale.y = Math.max(0.001, lid); C0.eyes.scale.y = 1 - lid * 0.9;
  renderer.render(scene, camera);
  if (announce) { parent.postMessage({ type: 'fc-clerk', cfg: announce }, location.origin); announce = null; root.dataset.ready = '1'; }
}
// the loop stops while the tab is hidden and picks up where it was (no time jump) when it shows again
document.addEventListener('visibilitychange', () => { if (!document.hidden && !frame) { last = performance.now(); frame = requestAnimationFrame(loop); } });
frame = requestAnimationFrame(loop);
</script>
