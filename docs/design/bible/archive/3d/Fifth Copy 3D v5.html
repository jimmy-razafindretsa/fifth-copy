<script>
// ---------- Typewriter overlay ----------
const TEXT = "CIO VERLIN TO LANGLEIGH. PRESIDENT CARVER WILL REJECT BRINE II DRAFT. ASSET NIGHTINGALE MEETS AT CHECKPOINT CHARLES 0400. BURN AFTER READING.";
const LINE = 30, CW = 14;
const lines = []; { let cur = ''; for (const w of TEXT.split(' ')) { if ((cur + (cur ? ' ' : '') + w).length > LINE) { lines.push(cur + ' '); cur = w; } else cur += (cur ? ' ' : '') + w; } lines.push(cur); }
const flat = lines.join('');
let li = 0, col = 0, idx = 0, started = 0, correct = 0, badCell = false;
const paper = document.getElementById('paper'), tape = document.getElementById('tape');
paper.style.width = (LINE * CW) + 'px';
tape.innerHTML = [...flat].map(c => `<span>${c === ' ' ? '&nbsp;' : c}</span>`).join('');
const tapeSpans = tape.children;
function newLine() { const d = document.createElement('div'); d.className = 'line'; paper.appendChild(d); return d; }
let lineEl = newLine();
function layout(cr) {
  paper.classList.toggle('cr', !!cr);
  paper.style.transform = `translateX(${(paper.parentNode.clientWidth / 2) - 40 - col * CW - CW / 2}px)`;
  [...tapeSpans].forEach((s, i) => { s.className = i < idx ? 'done' : i === idx ? 'cur' : ''; });
  tape.style.transform = `translateX(${-idx * CW - CW / 2}px)`;
}
layout();
window.addEventListener('resize', () => layout());
// keyboard
const rows = ['1234567890', 'QWERTYUIOP', 'ASDFGHJKL.', 'ZXCVBNM,'];
const keyEls = {};
const kb = document.getElementById('kb');
rows.forEach(r => { const row = document.createElement('div'); row.className = 'krow'; [...r].forEach(c => { const k = document.createElement('div'); k.className = 'key'; k.textContent = c; keyEls[c] = k; row.appendChild(k); }); kb.appendChild(row); });
{ const row = document.createElement('div'); row.className = 'krow'; const k = document.createElement('div'); k.className = 'key space'; keyEls[' '] = k; row.appendChild(k); kb.appendChild(row); }
{ const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'click the scene once, then type — typos strike red, the right key overstrikes'; kb.appendChild(h); }
function press(c, bad) { const k = keyEls[c]; if (!k) return; k.classList.add('down'); bad && k.classList.add('bad'); setTimeout(() => k.classList.remove('down', 'bad'), bad ? 220 : 90); }
window.rt = { strikes: 0, progress: () => idx / flat.length };
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('pov') || e.metaKey || e.ctrlKey || e.key.length !== 1 || idx >= flat.length) return;
  e.preventDefault();
  if (!started) started = performance.now();
  const c = e.key.toUpperCase(), want = flat[idx];
  window.rt.strikes++;
  let cell = lineEl.children[col];
  if (!cell) { cell = document.createElement('span'); lineEl.appendChild(cell); }
  const jitter = `transform:translateY(${(Math.random() - .5) * 1.4}px) rotate(${(Math.random() - .5) * 3}deg);opacity:${.75 + Math.random() * .25}`;
  if (c !== want) { press(c, true); cell.textContent = c === ' ' ? '\u00a0' : c; cell.className = 'bad hit'; cell.style.cssText = jitter; badCell = true; return; }
  press(c, false);
  cell.textContent = c === ' ' ? '\u00a0' : c; cell.className = (badCell ? 'x ' : '') + 'hit'; cell.style.cssText = jitter; badCell = false;
  correct++; idx++; col++;
  if (col >= lines[li].length && li < lines.length - 1) {
    li++; col = 0; lineEl = newLine();
    const lev = document.getElementById('lever'), bell = document.getElementById('bell');
    lev.classList.add('throw'); bell.classList.add('ding');
    setTimeout(() => { lev.classList.remove('throw'); bell.classList.remove('ding'); }, 260);
    layout(true);
  } else layout(false);
  const mins = (performance.now() - started) / 60000;
  const wpm = Math.min(999, Math.round(correct / 5 / Math.max(mins, 1 / 60)));
  [...document.querySelectorAll('#wpm span')].forEach((s, i) => s.textContent = String(wpm).padStart(3, '0')[i]);
});
</script>

<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const scene = stage._scene, cam = stage._camera, ctr = stage._controls, ren = stage._renderer;

// Warm toy-like lighting
scene.children.forEach(o => {
  if (o.isHemisphereLight) { o.color.set(0xd8dccf); o.groundColor.set(0x2e2c28); o.intensity = 1.25; }
  else if (o.isDirectionalLight && o !== stage._key) o.intensity = 0.3;
});
stage._key.color.set(0xe8ecd8); stage._key.intensity = 1.5; stage._key.position.set(2, 12, 3);
stage._key.shadow.mapSize.set(1024, 1024);
scene.fog = new THREE.Fog(0x2B2C2A, 11, 30);
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.05;
ren.setPixelRatio(Math.min(devicePixelRatio, 1.5));

// Shared materials (Lambert = cheap) + geometry cache
const L = (name, color, o = {}) => { const m = new THREE.MeshLambertMaterial({ color, ...o }); m.name = name; return m; };
const mat = {
  floor: L('dirty_concrete', 0x5a5750), wall: L('grey_green_wall', 0x7c7f77, { side: THREE.BackSide }), wainscot: L('grime_wainscot', 0x45463f, { side: THREE.BackSide }),
  steel: L('desk_steel', 0x6f736c), bakelite: L('bakelite', 0x2a1e17), paper: L('paper', 0xEDE0C2, { side: THREE.DoubleSide }),
  black: L('black', 0x111111), white: L('teeth_white', 0xf2ede0), brass: L('brass', 0xc9a85a), red: L('stamp_black', 0x1d1c1a), banner: L('banner_red', 0xA8161C, { side: THREE.DoubleSide }),
  olive: L('officer_grey', 0x55595e), boots: L('boots', 0x1a120d),
  glow: L('glow', 0xffd090, { emissive: 0xffb050, emissiveIntensity: 1.6 }), ember: L('ember', 0xff7a1a, { emissive: 0xff5a00, emissiveIntensity: 2 }),
  crt: L('crt', 0x0b1a10, { emissive: 0x5CFF8A, emissiveIntensity: 1 }), shade: L('shade_green', 0x4F6B5A, { side: THREE.DoubleSide }),
};
const skins = [0xe0a882, 0xc98a62, 0x9a6444, 0xf0c4a0].map((c, i) => L(`skin_${i}`, c));
const cloth = [0x5a5d61, 0x46484c, 0x7a7d80, 0x4d5246, 0x3a3b3d, 0x6b6258].map((c, i) => L(`cloth_${i}`, c));
const hats = [0x3a3b3d, 0x5a5d61, 0x2a2a2e, 0x4a4a3e].map((c, i) => L(`hat_${i}`, c));
const hairs = [0x2a1e14, 0x6a4a2a, 0xb8b0a0, 0x1a1a1a].map((c, i) => L(`hair_${i}`, c));
const GC = {}; const G = (k, f) => GC[k] || (GC[k] = f());
const mesh = (name, geo, m, x = 0, y = 0, z = 0, parent) => { const o = new THREE.Mesh(geo, m); o.name = name; o.position.set(x, y, z); parent && parent.add(o); return o; };
const B = (w, h, d) => G(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
const S = (r, w = 12, h = 9) => G(`s${r},${w},${h}`, () => new THREE.SphereGeometry(r, w, h));
const C = (rt, rb, h, s = 12, open = false) => G(`c${rt},${rb},${h},${s},${open}`, () => new THREE.CylinderGeometry(rt, rb, h, s, 1, open));
const CAP = (r, l, s = 10) => G(`k${r},${l},${s}`, () => new THREE.CapsuleGeometry(r, l, 3, s));

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = (a) => a[Math.floor(rnd() * a.length)];

// Shared face kit — big chunky head, fun details
function face(n, head, skin, opts) {
  const R = opts.r;
  mesh(`${n}_skull`, S(R, 14, 10), skin, 0, 0, 0, head).scale.set(1, 1.08, 1);
  mesh(`${n}_jowl`, S(R * 0.8, 12, 8), skin, 0, -R * 0.45, R * 0.12, head).scale.set(1.1, 0.7, 1);
  mesh(`${n}_nose`, S(R * 0.32, 10, 8), skin, 0, -R * 0.08, R * 0.95, head).scale.set(1, 0.9, 1.1);
  mesh(`${n}_ear_L`, S(R * 0.2, 8, 6), skin, -R * 0.98, 0, 0, head).scale.set(0.5, 1, 0.8);
  mesh(`${n}_ear_R`, S(R * 0.2, 8, 6), skin, R * 0.98, 0, 0, head).scale.set(0.5, 1, 0.8);
  const ey = R * 0.22, ez = R * 0.86, ex = R * 0.36;
  if (opts.eyes === 'shades') {
    [-1, 1].forEach(s => { const l = mesh(`${n}_lens_${s}`, C(R * 0.27, R * 0.27, R * 0.06, 14), mat.black, s * ex, ey, ez + 0.01, head); l.rotation.x = Math.PI / 2; });
    mesh(`${n}_bridge`, B(R * 0.3, R * 0.05, R * 0.05), mat.black, 0, ey + R * 0.06, ez + 0.03, head);
  } else if (opts.eyes === 'monocle') {
    mesh(`${n}_eye_L`, B(R * 0.28, R * 0.05, R * 0.05), mat.black, -ex, ey, ez + 0.02, head).rotation.z = 0.15; // squint
    mesh(`${n}_eye_R`, S(R * 0.11, 8, 6), mat.black, ex, ey, ez + 0.02, head);
    const m = mesh(`${n}_monocle`, G('mono', () => new THREE.TorusGeometry(R * 0.2, R * 0.035, 6, 16)), mat.brass, ex, ey, ez + 0.05, head);
    mesh(`${n}_monocle_chain`, B(R * 0.02, R * 0.6, R * 0.02), mat.brass, ex + R * 0.2, ey - R * 0.3, ez, head);
  } else {
    [-1, 1].forEach(s => mesh(`${n}_eye_${s}`, S(R * 0.1, 8, 6), mat.black, s * ex, ey, ez + 0.02, head));
  }
  if (opts.brows) [-1, 1].forEach(s => { const b = mesh(`${n}_brow_${s}`, B(R * 0.36, R * 0.08, R * 0.08), opts.hairMat, s * ex, ey + R * 0.26, ez - 0.005, head); b.rotation.z = s * -0.35; });
  if (opts.stache) [-1, 1].forEach(s => { const m = mesh(`${n}_stache_${s}`, CAP(R * 0.1, R * 0.32, 8), opts.hairMat, s * R * 0.2, -R * 0.32, R * 0.9, head); m.rotation.z = Math.PI / 2 + s * 0.35; });
  else mesh(`${n}_mouth`, B(R * 0.3, R * 0.04, R * 0.04), mat.black, R * 0.05, -R * 0.38, R * 0.88, head).rotation.z = -0.15;
  if (opts.cig) {
    const c = mesh(`${n}_cig`, C(0.007, 0.007, 0.09, 6), mat.white, R * 0.38, -R * 0.4, R * 0.95, head); c.rotation.z = Math.PI / 2 - 0.4; c.rotation.y = -0.6;
    mesh(`${n}_ember`, S(0.009, 6, 4), mat.ember, R * 0.38 + 0.04, -R * 0.4 - 0.016, R * 0.95 + 0.03, head);
  }
  const hm = opts.hatMat, top = R * 1.08;
  if (opts.hat === 'ushanka') {
    mesh(`${n}_hat`, C(R * 1.05, R * 1.08, R * 0.6, 14), hm, 0, top * 0.62, -R * 0.05, head);
    [-1, 1].forEach(s => mesh(`${n}_flap_${s}`, B(R * 0.25, R * 0.7, R * 0.8), hm, s * R * 0.98, top * 0.15, -R * 0.1, head));
  } else if (opts.hat === 'cap') {
    mesh(`${n}_hat`, S(R * 1.02, 14, 6), hm, 0, R * 0.3, 0, head).scale.set(1, 0.55, 1.05);
    mesh(`${n}_peak`, B(R * 1.2, R * 0.08, R * 0.6), hm, 0, R * 0.5, R * 0.95, head).rotation.x = 0.2;
  } else if (opts.hat === 'fedora') {
    mesh(`${n}_hat`, C(R * 0.75, R * 0.85, R * 0.6, 14), hm, 0, top * 0.82, 0, head);
    mesh(`${n}_band`, C(R * 0.86, R * 0.86, R * 0.12, 14), mat.black, 0, top * 0.6, 0, head);
    mesh(`${n}_brim`, C(R * 1.45, R * 1.45, R * 0.05, 16), hm, 0, top * 0.55, 0, head);
  } else if (opts.hat === 'hair') {
    mesh(`${n}_hair`, S(R * 1.03, 14, 7), opts.hairMat, 0, R * 0.12, -R * 0.08, head).scale.set(1, 0.8, 1);
  } // bald = nothing (very shiny skull)
}

const room = new THREE.Group(); room.name = 'ring_room';
const R_ROOM = 7.5, R_DESK = 4.6, N = 30, PLAYER = 0;
mesh('floor', new THREE.CircleGeometry(R_ROOM, 48), mat.floor, 0, 0, 0, room).rotation.x = -Math.PI / 2;
mesh('wall', new THREE.CylinderGeometry(R_ROOM, R_ROOM, 3.8, 48, 1, true), mat.wall, 0, 1.9, 0, room);

// ---------- Bake static geometry: one draw call per material ----------
function mergeGeos(geos) {
  let vc = 0, ic = 0; for (const g of geos) { vc += g.attributes.position.count; ic += g.index ? g.index.count : g.attributes.position.count; }
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), uv = new Float32Array(vc * 2), idx = new Uint32Array(ic);
  let vo = 0, io = 0;
  for (const g of geos) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3); nor.set(g.attributes.normal.array, vo * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, vo * 2);
    if (g.index) { const a = g.index.array; for (let k = 0; k < a.length; k++) idx[io + k] = a[k] + vo; io += a.length; }
    else { for (let k = 0; k < n; k++) idx[io + k] = vo + k; io += n; }
    vo += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1)); out.computeBoundingSphere(); return out;
}
function bake(root, exclude, label) {
  root.updateMatrixWorld(true);
  const inv = root.matrixWorld.clone().invert(), byMat = new Map(), victims = [];
  (function walk(o) { for (const c of [...o.children]) { if (exclude.has(c)) continue; if (c.isMesh) { const m = new THREE.Matrix4().multiplyMatrices(inv, c.matrixWorld); const g = c.geometry.clone().applyMatrix4(m); if (!byMat.has(c.material)) byMat.set(c.material, []); byMat.get(c.material).push(g); victims.push(c); } walk(c); } })(root);
  victims.forEach(v => v.parent.remove(v));
  for (const [m, list] of byMat) { const mm = new THREE.Mesh(mergeGeos(list), m); mm.name = label + '_' + m.name; root.add(mm); }
}

function setPOV(on) {

  document.getElementById('over').classList.toggle('on', !on);
  ['tapebox', 'tapelabel'].forEach(id => document.getElementById(id).style.display = on ? 'block' : 'none');
  toolbarEls.forEach(el => el.style.visibility = on ? 'hidden' : '');
  me.head.visible = !on; me.body.visible = !on; me.paper.visible = !on;

  } else { cam.fov = 45; cam.position.copy(overview.pos); ctr.target.copy(overview.tgt); }
  cam.updateProjectionMatrix(); ctr.update();
}

// ---------- Animation ----------
let flickT = 2, flickOn = true;
const clock = new THREE.Clock(); let t = 0, oYaw = 0, lastStrikes = 0, myPunch = 0;
const watchedEl = document.getElementById('watched'), vig = document.getElementById('vig');
const perf = document.getElementById('perf'); let fpsAcc = 0, fpsN = 0;
const placeEls = [...document.querySelectorAll('#place span')];
const meDir = me.g.position.clone().setY(0).normalize();
const tick = () => {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  for (const ty of typists) {
    if (ty === me) continue;
    const s = ty.cps * 2.4;
    ty.arms[0].rotation.x = 0.2 + Math.max(0, Math.sin(t * s + ty.phase)) * 0.12;
    ty.arms[1].rotation.x = 0.2 + Math.max(0, Math.sin(t * s * 1.13 + ty.phase + 1.7)) * 0.12;
    ty.head.rotation.x = 0.2 + Math.sin(t * 0.7 + ty.phase) * 0.05;
    ty.head.rotation.y = Math.sin(t * 0.23 + ty.phase) * 0.15;
    const prog = Math.min(1, (t * ty.cps) / 125);
    ty.prog = prog; ty.paper.scale.y = 0.4 + prog * 0.7;
  }
  // player's own arms react to real keystrokes
  if (window.rt.strikes !== lastStrikes) { lastStrikes = window.rt.strikes; myPunch = 1; }
  myPunch = Math.max(0, myPunch - dt * 10);
  me.arms[lastStrikes % 2].rotation.x = 0.2 + myPunch * 0.25;
  // officer sweeps and lingers
  const linger = Math.pow(0.5 + 0.5 * Math.sin(t * 0.4), 3);
  oYaw += dt * 0.45 * linger; officer.rotation.y = oYaw;
  oHead.rotation.y = Math.sin(t * 0.9) * 0.3;
  penArm.rotation.x = Math.sin(t * 6) * 0.05 * (1 - linger);
  const fwd = new THREE.Vector3(Math.sin(oYaw + oHead.rotation.y), 0, Math.cos(oYaw + oHead.rotation.y));
  const watched = fwd.dot(meDir) > 0.93 && document.body.classList.contains('pov');
  watchedEl.style.opacity = watched ? 1 : 0; vig.classList.toggle('tight', watched);
  // dirty bulb: hum + irregular stutters
  flickT -= dt; if (flickT <= 0) { flickOn = !flickOn; flickT = flickOn ? 1.5 + Math.random() * 5 : 0.04 + Math.random() * 0.12; if (flickOn && Math.random() < 0.4) flickT = 0.06; }
  const lv = flickOn ? 22 + Math.sin(t * 37) * 0.8 : 4;
  lampLight.intensity = lv; mat.glow.emissiveIntensity = flickOn ? 1.6 : 0.2;
  // race placing
  const myProg = window.rt.progress();
  const place = 1 + typists.filter(ty => ty !== me && ty.prog > myProg).length;
  const ps = String(place).padStart(2, '0'); placeEls[0].textContent = ps[0]; placeEls[1].textContent = ps[1];
  // perf readout
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { const i = ren.info.render; perf.textContent = `${Math.round(fpsN / fpsAcc)} fps\n${(i.triangles / 1000).toFixed(0)}k tris\n${i.calls} calls`; fpsAcc = 0; fpsN = 0; }
};
const base = stage._loop;
stage._loop = () => { tick(); base(); };
