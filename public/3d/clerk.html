    if (u > 0.85) { const w = bell(u, 0.85, 2.2); tgt[1].lerp(new THREE.Vector3(0.14, 0.9, 0.17), w); }
    if (!o.swapped && u > 0.37) { o.swapped = true; issue(); }
  } },
};
const IDLE = ['wave', 'stretch', 'look', 'salute', 'scratch'];
let act = null, actT = 0, nextIdle = 2.5, actState = {};
function play(name) { act = name; actT = 0; actState = {}; }
function click() { if (act === 'hop' && actT < 0.7) return; play('hop'); }

let mx = 0, my = 0, hx = 0, hy = 0, ex = 0, ey2 = 0, blinkAt = 1.5, bt = -1, t = 0, last = performance.now();
addEventListener('message', e => { const d = e.data || {}; if (d.type === 'fc-look') { mx = d.x; my = d.y; } if (d.type === 'fc-reissue') click(); if (d.type === 'fc-setcfg') { issue(d.cfg); play('tryon'); } });
addEventListener('pointermove', e => { mx = (e.clientX / innerWidth) * 2 - 1; my = (e.clientY / innerHeight) * 2 - 1.3; });
addEventListener('pointerdown', () => LOCKER ? play('wave') : click());
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const k = 1 - Math.exp(-dt * 5), ke = 1 - Math.exp(-dt * 16);
  const tx = Math.max(-1, Math.min(1, mx)), ty = Math.max(-1, Math.min(1, my));
  hx += (tx * 0.75 - hx) * k; hy += (ty * 0.4 - hy) * k;
  ex += ((tx * 0.75 - hx) * 0.06 + tx * 0.006 - ex) * ke; ey2 += (-(ty * 0.4 - hy) * 0.06 - ty * 0.004 - ey2) * ke;
  // gesture layer
  restOf(-1, tgt[-1]); restOf(1, tgt[1]);
  const o = Object.assign(actState, { y: 0, sy: 1, sx: 1, hx: 0, hy: 0, hz: 0, lock: 0 });
  if (!act && t > nextIdle) play(IDLE[Math.floor(Math.random() * IDLE.length)]);
  if (act) { ACTS[act].f(actT, o); actT += dt; if (actT > ACTS[act].d) { act = null; nextIdle = t + 3 + Math.random() * 3; } }
  aim(-1, tgt[-1]); aim(1, tgt[1]);
  char.position.y = o.y; char.scale.set(o.sx, o.sy, o.sx);
  const lx = hx * (1 - o.lock) + o.hx, ly = hy * (1 - o.lock) + o.hy;
  char.rotation.y = hx * 0.25;
  C0.head.rotation.set(ly, lx * 0.75, o.hz);
  C0.eyes.position.set(Math.max(-0.012, Math.min(0.012, ex)), Math.max(-0.008, Math.min(0.008, ey2)), 0);
  C0.body.scale.set(1 + Math.sin(t * 1.6) * 0.008, 1, 1);
  if (t > blinkAt) { bt = t; blinkAt = t + 2 + Math.random() * 3; }
  const bp = (t - bt) / 0.15, lid = bp >= 0 && bp <= 1 ? Math.sin(bp * Math.PI) : 0;
  C0.lids.visible = lid > 0.01; C0.lids.scale.y = Math.max(0.001, lid); C0.eyes.scale.y = 1 - lid * 0.9;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
